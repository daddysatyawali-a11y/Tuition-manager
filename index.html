   ===================================================================== */
PAGES.about=function(){
  return{title:'About & Help',html:'<div class="wrap narrow help">'+
  '<h3>Your data stays on this device</h3><p>Tuition Manager has no account and no server. Students, fees, tests and attendance are stored in this browser only. Nobody else can see them, and nothing is uploaded unless you share it yourself.</p><p>The flip side: uninstalling the app or clearing browser data erases everything. Back up regularly.</p>'+
  '<h3>Students</h3><p>Add students with their classes, contacts and fee type (one-time total or monthly). Mark a student as left to keep their history, or delete them. Batch tools add or edit many at once.</p>'+
  '<h3>Payments</h3><p>Record a payment from a student’s profile or the Payments tab. Share a receipt as an image, share a student’s fees with a parent as all transactions or a monthly breakdown, send a fee reminder on WhatsApp, or export your data to Excel.</p>'+
  '<h3>Tests</h3><p>Create a test and enter every student’s marks on one screen. Leave a mark blank for an absent student. A recorded 0 still counts in the average.</p>'+
  '<h3>Attendance</h3><p>Everyone is present by default. Tap Mark absent for those who missed the day, or use Tuition off for a holiday. The monthly summary shows each student’s percentage.</p>'+
  '<h3>Classes and reports</h3><p>Rename a class and everything follows. Retire a class when it ends; its history stays available. Reports show subject performance, fee collection and attendance.</p>'+
  '<h3>Export to Excel</h3><p>Open the menu and choose Export to Excel (the download button on the Payments tab opens the same screen). Tick what you want: student details, payments, fee details, attendance and test history. Everything goes into one workbook with a sheet for each choice. The date range limits payments, attendance and tests.</p>'+
  '<h3>Fees, due day and overdue</h3><p>Set a default fee for each class on the Classes screen. It fills in when you add a student. Tick Free student for anyone who pays nothing. A fee below the class default shows as Discounted on the profile only, never in anything you share. Choose the fee due day in Settings: a fee counts as overdue only after that day passes, and Home and Alerts show just those overdue amounts.</p>'+
  '<h3>Debits, credits and people</h3><p>On the Payments tab, tap New entry and choose Fee payment, Debit or Credit. A debit is money going out: choose Expense, or Pay someone and give their name. A credit is money you receive from a person. Every person has their own ledger of what you paid and received, and you can open all of them from the menu under Ledger. Expenses are debits only.</p>'+
  '<h3>Customize the home screen</h3><p>Open Settings and choose Customize home screen, then tick what to show. The bell icon always opens Alerts.</p>'+
  '<h3>Absent message</h3><p>After saving attendance, tap the chat icon beside an absent student to message their parent on WhatsApp.</p>'+
  '<h3>How do I back up my data?</h3><ol><li>Open the menu and choose Backup &amp; Restore.</li><li>Tap Backup data.</li><li>Choose Save to this phone, or Share to send the file through WhatsApp, Drive or email.</li><li>Keep the file somewhere safe.</li></ol>'+
  '<h3>How do I restore?</h3><ol><li>Open Backup &amp; Restore and tap Restore backup.</li><li>Pick your backup file and confirm. Restoring replaces everything on this device.</li></ol>'+
  '<h3>How do I connect Google Drive?</h3><ol><li>The app must be hosted over https with a Google client ID set in its code.</li><li>Open Backup &amp; Restore and tap Connect Google Drive.</li><li>Allow access. Then use Back up to Drive and Restore from Drive.</li></ol>'+
  '<h3>Install the app</h3><p>Use your browser’s Install or Add to Home Screen option. When the browser supports it, Install App also appears in the menu.</p>'+
  '<div class="card" style="margin-top:1.4rem;text-align:center"><small>About the app</small><p style="margin-top:.3rem">Tuition Manager is made by<br><b>Mukul Sharma</b><br>Department of Physics</p></div></div>'};
};

PAGES.notifications=function(){
  const n=notifData(),last=state.lastBackupAt;let h='';
  h+=n.defaulters.length?
    '<div class="sect"><h2>Overdue fees</h2><span class="pill bad">'+n.defaulters.length+'</span></div><div class="list">'+n.defaulters.map(x=>'<div class="row"><button class="rowmain" data-a="stu" data-id="'+x.s.id+'">'+avatar(x.s.name,stuColor(x.s))+'<span class="grow"><b>'+esc(x.s.name)+'</b><small>'+esc(clsLabel(x.s))+' · '+esc(overdueMonths(x.o))+'</small></span><span class="end"><b class="bal num">'+inr(x.o.total)+'</b></span></button><button class="btn sm" data-a="remindOverdue" data-id="'+x.s.id+'">Remind</button></div>').join('')+'</div>':
    '<div class="sect"><h2>Overdue fees</h2></div><div class="list"><div class="empty">'+ic('check')+'<b>No overdue fees</b><small>Nobody is past their due date.</small></div></div>';
  h+='<div class="sect"><h2>Backup</h2></div><div class="list"><div class="notif"><span class="act-ic">'+ic('cloud')+'</span><span class="grow" style="white-space:normal"><b class="'+(n.backup?'bad':'')+'" style="white-space:normal">'+(last?'Last backup was '+ago(last):'You haven’t backed up yet')+'</b><small style="white-space:normal">'+(n.backup?'Back up now so your records are safe.':'Your data is safe as of that backup.')+'</small></span><span class="btns" style="flex:none;flex-wrap:nowrap"><button class="btn sm primary" style="min-width:0" data-a="doBackup">Back up</button></span></div></div>';
  return{title:'Alerts',html:'<div class="wrap narrow">'+h+'</div>'};
};
ACT.dismissNotif=el=>{state.notifDismissed[el.dataset.k]=true;save();render(true)};

/* =====================================================================
   FIRST-RUN SETUP & LOCK SCREEN
   ===================================================================== */
let suClasses=[];
function setupHTML(){
  const now=new Date(),sy=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  return '<div class="center-screen"><div class="setup"><div class="logo">T</div><div><h1>Set up Tuition Manager</h1><p class="muted">A few details and you’re ready. You can change any of them later.</p></div>'+
  '<div class="fgroup"><label class="f">Your name *<input class="inp" id="su_name" autocomplete="name"></label><label class="f">Institute name *<input class="inp" id="su_brand" placeholder="For example, Sharma Tuition Classes"></label><div class="seg"><label><input type="radio" name="sg" value="male" checked><span>Sir</span></label><label><input type="radio" name="sg" value="female"><span>Ma’am</span></label></div></div>'+
  '<div class="fgroup"><h4>Academic session</h4><div class="two stack"><label class="f">Starts *<input class="inp" type="month" id="su_start" value="'+sy+'-04"></label><label class="f">Ends *<input class="inp" type="month" id="su_end" value="'+(sy+1)+'-03"></label></div></div>'+
  '<div class="fgroup"><h4>Your classes *</h4><div class="inrow"><input class="inp" id="su_cls" placeholder="For example, 9th CBSE"><button class="btn" data-a="suAdd">Add</button></div><div class="chipbox" id="su_chips"></div></div>'+
  '<button class="btn primary big" data-a="suFinish">Start using the app</button>'+
  '<button class="btn ghost big" data-a="suRestore">'+ic('up')+'Restore from a backup file</button><input type="file" id="su_file" accept=".json,application/json" class="hidden" data-ch="restoreFile"></div></div>';
}
function drawSuChips(){$('#su_chips').innerHTML=suClasses.map((c,i)=>'<span class="chipx">'+esc(c)+'<button data-a="suRm" data-i="'+i+'" aria-label="Remove '+esc(c)+'">'+ic('x')+'</button></span>').join('')}
function suAddPending(){
  const inp=$('#su_cls'),v=inp.value.trim();if(!v)return true;
  if(suClasses.some(c=>norm(c)===norm(v))){toast('You already added that class','err');return false}
  suClasses.push(v);inp.value='';drawSuChips();return true;
}
function bindSetup(){
  suClasses=[];drawSuChips();
  $('#su_cls').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();suAddPending()}});
}
ACT.suRestore=()=>$('#su_file').click();
ACT.suAdd=()=>{suAddPending();$('#su_cls').focus()};
ACT.suRm=el=>{suClasses.splice(+el.dataset.i,1);drawSuChips()};
ACT.suFinish=async()=>{
  const name=$('#su_name').value.trim(),brand=$('#su_brand').value.trim(),s=$('#su_start').value,e=$('#su_end').value;
  if(!name){toast('Enter your name','err');$('#su_name').focus();return}
  if(!brand){toast('Enter your institute name','err');$('#su_brand').focus();return}
  if(!s||!e||s>e){toast('The session must start on or before its end','err');return}
  if(!suAddPending())return;
  if(!suClasses.length){toast('Add at least one class','err');$('#su_cls').focus();return}
  Object.assign(state,{teacher:name,brand,gender:document.querySelector('input[name=sg]:checked').value,sessionStart:s,sessionEnd:e,classes:suClasses.slice(),activeClass:'All',setupDone:true,loggedOut:false});
  await flush();toast('Welcome, '+name.split(/\s+/)[0]);renderRoot();
};
function lockHTML(){
  return '<div class="center-screen"><div class="lock">'+avatar(state.teacher,'','lg')+'<small>Welcome back</small><h1>'+esc(state.teacher)+'</h1><p class="muted">'+esc(state.brand)+'</p><button class="btn primary big" style="max-width:20rem;margin-top:.6rem" data-a="unlock">'+ic('lock')+'Unlock</button></div></div>';
}
ACT.unlock=async()=>{state.loggedOut=false;await flush();renderRoot()};

function renderRoot(){
  const full=$('#full'),shell=$('#shell');
  closeAllOverlays();closeDrawer();
  if(!state.setupDone){shell.hidden=true;full.hidden=false;full.innerHTML=setupHTML();bindSetup();return}
  if(state.loggedOut){shell.hidden=true;full.hidden=false;full.innerHTML=lockHTML();return}
  full.hidden=true;full.innerHTML='';shell.hidden=false;render();
}

/* =====================================================================
   THEME + BOOT
   ===================================================================== */
function applyTheme(){
  const t=state.theme==='system'?(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):state.theme;
  const r=document.documentElement;
  r.dataset.theme=t;r.style.setProperty('--h',state.accentHue);
  r.style.setProperty('--font',(FONTS[state.appFont]||FONTS.system).s);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#10141C':'#F1F4F9';
}
async function boot(){
  await store.init();
  storageOK=await store.selfCheck();
  try{
    const raw=await store.getRaw(STATE_KEY);
    if(raw){
      try{state=normalizeState(JSON.parse(raw))}
      catch(e){try{await store.setRaw('state-unreadable',raw)}catch(_){}toast('Saved data could not be read. A copy was kept aside.','err')}
    }
  }catch(e){console.error(e)}
  applyTheme();
  let _wasSmall=smallScreen();
addEventListener('resize',()=>{const sm=smallScreen();if(sm!==_wasSmall){_wasSmall=sm;render(true)}});
try{matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()})}catch(e){}
  $('#tabs').innerHTML=TAB_DEF.map(t=>'<button data-a="tab" data-t="'+t[0]+'">'+ic(t[1])+'<span>'+t[2]+'</span></button>').join('');
  initHistory();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  window.addEventListener('pagehide',()=>{flush()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  renderRoot();
}
boot();
</script>
