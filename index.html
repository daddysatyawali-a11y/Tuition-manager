<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuition Manager</title>
<meta name="description" content="Manage students, fees, tests and attendance for your tuition classes. Works offline, keeps data on your device.">
<meta name="theme-color" content="#10141C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuition Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --h:210;--scale:1;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#10141C;--s1:#171C26;--s2:#1E2531;--s3:#283041;--line:#2B3446;
  --tx:#E8ECF3;--tx2:#A2ACBF;--tx3:#727D92;
  --ac:hsl(var(--h) 88% 68%);--ac-soft:hsl(var(--h) 70% 60% / .16);--ac-glow:hsl(var(--h) 90% 60% / .35);--ac-ink:#0A0F1A;
  --good:#4CC9A0;--warn:#F2B44B;--bad:#F87171;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#F1F4F9;--s1:#FFFFFF;--s2:#F4F6FA;--s3:#E7ECF4;--line:#DCE2EC;
  --tx:#141A26;--tx2:#4A5468;--tx3:#7A8499;
  --ac:hsl(var(--h) 72% 42%);--ac-soft:hsl(var(--h) 80% 45% / .11);--ac-glow:hsl(var(--h) 80% 45% / .28);--ac-ink:#FFFFFF;
  --good:#12805F;--warn:#A85F00;--bad:#C62828;
  --shadow:0 8px 24px rgba(20,26,38,.09);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);line-height:1.45;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:var(--ac)}
small{color:var(--tx2);font-size:.8rem}
h2{font-size:1.05rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
h4{font-size:.9rem;font-weight:600;color:var(--tx2)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.grow>b,.grow>small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow>b{font-weight:600}
.muted{color:var(--tx2)}
.bal{color:var(--bad)}
.bal.zero,.good{color:var(--good)}
.warn{color:var(--warn)}
svg.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{min-height:100dvh}
#main{min-height:100dvh;padding-bottom:calc(4.6rem + env(safe-area-inset-bottom))}
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.4rem;padding:calc(.55rem + env(safe-area-inset-top)) .8rem .55rem;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#bar h1{flex:1;font-size:1.1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ib{position:relative;width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover,.ib:active{background:var(--s2);color:var(--tx)}
.badge{position:absolute;top:.15rem;right:.1rem;min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center}
#banner .warnbar{background:color-mix(in srgb,var(--warn) 16%,var(--s1));color:var(--tx);border-bottom:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));padding:.65rem 1rem;font-size:.86rem;display:flex;gap:.6rem;align-items:flex-start}
#banner .warnbar svg{color:var(--warn);margin-top:.1rem}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:1rem}
.wrap.narrow{max-width:46rem}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.6rem 0 .5rem;font-size:.72rem;color:var(--tx3);font-weight:500}
#tabs button.on{color:var(--ac);font-weight:650}
#tabs button.on svg{filter:drop-shadow(0 0 8px var(--ac-glow))}
@media(max-width:899px){body.page #tabs{display:none}body.page #main{padding-bottom:1rem}}
@media(min-width:900px){
  #tabs{top:0;bottom:0;right:auto;width:5.5rem;flex-direction:column;justify-content:flex-start;gap:.3rem;padding:1.1rem .5rem;border-top:0;border-right:1px solid var(--line)}
  #tabs button{flex:none;border-radius:14px;padding:.7rem 0}
  #tabs button.on{background:var(--ac-soft)}
  #main{margin-left:5.5rem;padding-bottom:2rem}
}

/* ---------- drawer ---------- */
#drawer{position:fixed;inset:0;z-index:40;pointer-events:none}
#drawer .dscrim{position:absolute;inset:0;background:rgba(5,8,14,.6);opacity:0;transition:opacity .22s}
#drawer .dpanel{position:absolute;left:0;top:0;bottom:0;width:min(20rem,86vw);background:var(--s1);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{pointer-events:auto}
#drawer.open .dscrim{opacity:1}
#drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:.8rem;padding:calc(1.2rem + env(safe-area-inset-top)) 1.1rem 1.1rem;border-bottom:1px solid var(--line);width:100%}
.dhead b{display:block;font-size:1.02rem}
.dnav{padding:.6rem;display:flex;flex-direction:column;gap:.15rem}
.dnav button{display:flex;align-items:center;gap:.85rem;padding:.75rem .85rem;border-radius:12px;color:var(--tx2);font-weight:500;width:100%}
.dnav button:hover{background:var(--s2)}
.dnav button.on{background:var(--ac-soft);color:var(--ac);font-weight:650}
.dnav hr{border:0;border-top:1px solid var(--line);margin:.4rem .5rem}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:1.1rem}
.list{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:.8rem;padding:.75rem 1rem;width:100%;border-bottom:1px solid var(--line);min-height:3.4rem}
.list>:last-child{border-bottom:0}
button.row:hover,button.row:active{background:var(--s2)}
.row .end{text-align:right;flex:none}
.row .end b{display:block}
.sect{display:flex;align-items:center;justify-content:space-between;margin:1.3rem 0 .6rem;gap:.5rem}
.sect:first-child{margin-top:.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.7rem}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:.95rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;text-align:left;width:100%;min-width:0}
.tile:hover{background:var(--s2)}
.tile .grow{width:100%}
.tile .bal,.tile b{font-size:.98rem}
.empty{text-align:center;padding:2.6rem 1rem;color:var(--tx2);display:flex;flex-direction:column;gap:.5rem;align-items:center}
.empty svg{width:2.2rem;height:2.2rem;color:var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:99px;background:var(--s3);color:var(--tx2);font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ac{background:var(--ac-soft);color:var(--ac)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

.av{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none;background:color-mix(in srgb,var(--c,var(--ac)) 26%,var(--s2));color:color-mix(in srgb,var(--c,var(--ac)) 78%,var(--tx))}
.av.lg{width:4.6rem;height:4.6rem;font-size:1.45rem}
.av.sm{width:2rem;height:2rem;font-size:.7rem}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.68rem 1.1rem;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--s2);text-align:center;line-height:1.2}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:.9rem}
.btn.sm{padding:.4rem .8rem;font-size:.86rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}
.btns>.btn{flex:1;min-width:10rem}
.inp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:.68rem .85rem;outline:0;min-height:2.85rem}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
textarea.inp{min-height:5rem;resize:vertical}
.f{display:flex;flex-direction:column;gap:.35rem;font-size:.84rem;color:var(--tx2);min-width:0}
.f>.inp{color:var(--tx);font-size:1rem}
.form{display:flex;flex-direction:column;gap:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:430px){.two.stack{grid-template-columns:1fr}}
.fgroup{display:flex;flex-direction:column;gap:.55rem;padding:.9rem;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
.inrow{display:flex;gap:.5rem;align-items:center}
.searchbar{display:flex;align-items:center;gap:.6rem;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 .9rem;color:var(--tx3);margin-bottom:.75rem}
.searchbar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.searchbar input{flex:1;background:none;border:0;outline:0;padding:.75rem 0;color:var(--tx);min-width:0}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.1rem 0 .8rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.2rem;padding:0 .95rem;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--tx2);white-space:nowrap;font-size:.88rem;flex:none;font-weight:500}
.chip .cnt{font-size:.75rem;opacity:.75}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent;font-weight:650}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:.2rem;gap:.15rem}
.seg>label,.seg>button{flex:1}
.seg input{display:none}
.seg span,.seg>button{display:block;text-align:center;padding:.5rem .4rem;border-radius:9px;color:var(--tx2);font-weight:500;font-size:.92rem}
.seg input:checked+span,.seg>button.on{background:var(--ac);color:var(--ac-ink);font-weight:650}
.fab{position:fixed;right:1rem;bottom:calc(5.2rem + env(safe-area-inset-bottom));z-index:15;display:flex;gap:.5rem;align-items:center;padding:.85rem 1.15rem;border-radius:16px;background:var(--ac);color:var(--ac-ink);font-weight:650;box-shadow:0 10px 26px var(--ac-glow)}
body.page .fab{bottom:calc(1.2rem + env(safe-area-inset-bottom))}
@media(min-width:900px){.fab{bottom:1.6rem;right:1.6rem}body.page .fab{bottom:1.6rem}}
.savebar{position:sticky;bottom:0;padding:.8rem 0 calc(.6rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:.5rem}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem}
.sw{width:2.3rem;height:2.3rem;border-radius:50%;border:2px solid transparent;background:var(--c);display:grid;place-items:center;color:#fff}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--bg) inset}
.sw.none{background:var(--s3);color:var(--tx2)}
.sw svg{width:1rem;height:1rem;stroke:#fff}
.rng{width:100%;accent-color:var(--ac)}

/* ---------- overlays ---------- */
#ov .ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#ov .scrim{position:absolute;inset:0;background:rgba(5,8,14,.62);opacity:0;transition:opacity .2s}
#ov .ov.in .scrim{opacity:1}
#ov .sheet{position:relative;width:100%;max-width:34rem;max-height:90dvh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:1.2rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));transform:translateY(28px);opacity:0;transition:transform .22s,opacity .2s;box-shadow:var(--shadow)}
#ov .ov.in .sheet{transform:none;opacity:1}
#ov .ov.center{align-items:center}
#ov .ov.center .sheet{border-radius:22px;max-width:26rem;margin:1rem;width:calc(100% - 2rem)}
.sheet h3{margin-bottom:.4rem;font-size:1.1rem}
.sheet p{color:var(--tx2);margin-bottom:1rem;font-size:.95rem}
.sheet .opt{display:flex;align-items:center;gap:.8rem;width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:14px;margin-bottom:.55rem;background:var(--s2)}
.sheet .opt:hover{background:var(--s3)}
.sheet .opt.danger{color:var(--bad)}
.sheet .opt small{display:block}
.row-end{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
body.page #toasts{bottom:calc(1.6rem + env(safe-area-inset-bottom))}
.toast{background:var(--s3);color:var(--tx);border:1px solid var(--line);padding:.65rem 1rem;border-radius:12px;box-shadow:var(--shadow);animation:pop .22s;font-size:.92rem;transition:opacity .3s}
.toast.err{background:color-mix(in srgb,var(--bad) 22%,var(--s1));border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.toast.out{opacity:0}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* ---------- home ---------- */
.home{display:grid;gap:.9rem;grid-template-columns:1fr}
.hero{padding:.4rem .1rem 0}
.hero small{display:block}
.hero h2{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:.2rem 0 .9rem}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.qa button{display:flex;align-items:center;gap:.7rem;padding:.75rem .8rem;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:.92rem;line-height:1.2;text-align:left}
.qa button:hover{background:var(--s2)}
.qa .qi{flex:none;width:2.4rem;height:2.4rem;border-radius:12px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center}
.quote{padding:1.1rem 1.2rem;border-radius:20px;background:linear-gradient(135deg,var(--ac-soft),transparent 70%),var(--s1);border:1px solid var(--line)}
.quote{display:flex;flex-direction:column;justify-content:center}
.quote p{font-size:1.02rem;line-height:1.5;margin-bottom:.5rem}
.quote small{display:block}
.chartcard{cursor:pointer;padding:1.1rem 1.1rem .6rem;position:relative;overflow:hidden}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.ch-val{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:.15rem}
.chartcard .ch-head>span{flex:none}
.mom{display:inline-flex;align-items:center;gap:.3rem;margin-top:.35rem;font-size:.8rem;font-weight:600}
.mom.up{color:var(--good)}.mom.down{color:var(--bad)}.mom.flat{color:var(--tx2)}
.mom svg{width:1rem;height:1rem}
.chart{width:100%;height:auto;display:block;margin-top:.4rem;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.chart text{fill:var(--tx3);font-size:11px;font-family:inherit}
.chart text.sel{fill:var(--tx);font-weight:700}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px var(--ac-glow))}
.chart .ln.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .1s forwards}
.chart .area{fill:url(#agrad);opacity:.9}
.chart .guide{stroke:var(--ac);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart .dot{fill:var(--bg);stroke:var(--ac);stroke-width:2.5}
.chart .dot.s{fill:var(--ac);stroke:var(--bg);stroke-width:3}
.chart rect.hit{fill:transparent;cursor:pointer}
@keyframes draw{to{stroke-dashoffset:0}}
.glance{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.glance button{position:relative;display:flex;flex-direction:column;gap:.15rem;padding:1rem;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left}
.glance button:hover{background:var(--s2)}
.glance .gi{color:var(--tx3);margin-bottom:.4rem}
.glance b{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.glance .badge{top:.9rem;right:.9rem;position:absolute}
.more{width:100%;padding:.7rem;color:var(--ac);font-size:.86rem;font-weight:600;text-align:center;border-top:1px solid var(--line)}
.banner-cta{display:flex;gap:.8rem;align-items:center;padding:1rem;border-radius:18px;border:1px dashed var(--ac);background:var(--ac-soft)}
.act-ic{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx2);flex:none}
.act-ic.pay{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.act-ic.left{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@media(min-width:900px){
  .home{grid-template-columns:repeat(12,1fr);gap:1rem}
  .home>*{grid-column:span 12}
  .home>.c4{grid-column:span 4}.home>.c5{grid-column:span 5}.home>.c6{grid-column:span 6}.home>.c7{grid-column:span 7}.home>.c8{grid-column:span 8}
  .qa{grid-template-columns:repeat(4,1fr)}
  .glance{grid-template-columns:repeat(4,1fr)}
  .hero h2{font-size:2.1rem}
  .hero-in{display:grid;grid-template-columns:1fr minmax(18rem,26rem);gap:1.5rem;align-items:end}
  .hero-in .searchbar{margin:0 0 .9rem}
}

/* ---------- misc components ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:.8rem .8rem}
.stat small{display:block;margin-bottom:.2rem}
.stat b{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
@media(max-width:380px){.stat b{font-size:.98rem}}
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4rem;padding:.4rem 0 1rem}
.phead h2{font-size:1.4rem;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--tx2)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.day{margin:1.1rem .2rem .45rem;font-size:.82rem;color:var(--tx2);font-weight:600}
.bar{height:.65rem;border-radius:99px;background:var(--s3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:inherit;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:8rem 1fr 3.2rem;gap:.7rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.hbar:last-child{border-bottom:0}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar>span:last-child{text-align:right;font-weight:700}
.thead{display:grid;grid-template-columns:1fr 6rem 4rem;gap:.6rem;padding:.55rem 1rem;font-size:.78rem;color:var(--tx2);border-bottom:1px solid var(--line);background:var(--s2)}
.trow{display:grid;grid-template-columns:1fr 6rem 4rem;gap:.6rem;align-items:center;padding:.65rem 1rem;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .who{display:flex;gap:.6rem;align-items:center;min-width:0}

/* ---------- storage (IndexedDB primary, localStorage fallback) ---------- */
const store={
  db:null,
  async init(){
    if('indexedDB' in window){
      try{
        this.db=await new Promise((ok,no)=>{
          const r=indexedDB.open('tuition-manager',1);
          r.onupgradeneeded=()=>r.result.createObjectStore('kv');
          r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('blocked'));
        });
      }catch(e){this.db=null}
    }
  },
  _req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async getRaw(k){
    if(this.db)return this._req(this.db.transaction('kv','readonly').objectStore('kv').get(k));
    const v=localStorage.getItem('tm:'+k);return v===null?undefined:v;
  },
  async setRaw(k,v){
    if(this.db)return new Promise((ok,no)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
    localStorage.setItem('tm:'+k,v);
  },
  async del(k){
    if(this.db)return new Promise((ok,no)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)});
    localStorage.removeItem('tm:'+k);
  },
  async keys(prefix=''){
    if(this.db){const all=await this._req(this.db.transaction('kv','readonly').objectStore('kv').getAllKeys());return all.filter(k=>String(k).startsWith(prefix))}
    const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tm:'+prefix))out.push(k.slice(3))}return out;
  },
  async getJ(k){const v=await this.getRaw(k);if(v==null)return null;try{return JSON.parse(v)}catch(e){return null}},
  setJ(k,o){return this.setRaw(k,JSON.stringify(o))},
  async selfCheck(){try{const v='t'+Date.now();await this.setRaw('__check',v);return (await this.getRaw('__check'))===v}catch(e){return false}}
};

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cdSize=0;central.forEach(c=>cdSize+=c.length);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function makeXlsx(sheetName,rows){
  const col=i=>String.fromCharCode(65+i);
  const x=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const sd=rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>{
    const ref=col(ci)+(ri+1);
    return typeof v==='number'?'<c r="'+ref+'"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+x(v)+'</t></is></c>';
  }).join('')+'</row>').join('');
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  return makeZip([
    {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
    {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+x(sheetName).slice(0,31)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},
    {name:'xl/worksheets/sheet1.xml',data:H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="26" customWidth="1"/><col min="2" max="2" width="22" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="12" customWidth="1"/><col min="5" max="5" width="14" customWidth="1"/><col min="6" max="6" width="30" customWidth="1"/></cols><sheetData>'+sd+'</sheetData></worksheet>'}
  ]);
}

function countUp(root){

    const to=+el.dataset.count||0,money=el.dataset.money!=null;

    const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(p<1?Math.round(to*e):to);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });

/* Back button / gesture: pops overlays, drawer, then the page stack. A cushion history entry keeps
   the browser from leaving the app on the first press. */
function logicalBack(){
  if(overlays.length){closeOverlay();return true}
  if($('#drawer').classList.contains('open')){closeDrawer();return true}
  if(stack.length){back();return true}
  return false;
}
function initHistory(){
  try{history.replaceState({tm:0},'');history.pushState({tm:1},'')}catch(e){}
  window.addEventListener('popstate',()=>{if(logicalBack()){try{history.pushState({tm:1},'')}catch(e){}}else{history.back()}});
}

let chartSel=null;const more={overdue:false,activity:false};

function chartModel(){
  const now=curYM();let months,mode;
  if(state.sessionStart&&state.sessionEnd&&state.sessionStart<=state.sessionEnd){months=monthRange(state.sessionStart,state.sessionEnd);mode='session'}
  else{months=monthRange(addMonths(now,-5),now);mode='six'}
  const by=feesByMonth();
  const pts=months.map(m=>({m,v:m<=now?(by[m]||0):null}));
  let sel=chartSel;
  if(sel==null||sel<0||sel>=pts.length||pts[sel].v==null){
    sel=pts.findIndex(p=>p.m===now);
    if(sel<0){sel=0;pts.forEach((p,i)=>{if(p.v!=null)sel=i})}
  }
  return{mode,pts,sel};
}
function chartInner(first){
  const {mode,pts,sel}=chartModel();
  const drawn=pts.filter(p=>p.v!=null);
  const max=niceMax(Math.max(0,...drawn.map(p=>p.v)));
  const W=640,H=232,L=54,R=16,T=14,B=30,iw=W-L-R,ih=H-T-B,n=pts.length;
  const X=i=>L+(n===1?iw/2:i*iw/(n-1)),Y=v=>T+ih-(v/max)*ih;
  let g='<defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>';
  for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+shortInr(v)+'</text>'}
  const step=Math.ceil(n/7);
  pts.forEach((p,i)=>{if(i%step===0||i===0||i===n-1||i===sel)g+='<text class="'+(i===sel?'sel':'')+'" x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+mShort(p.m)+'</text>'});
  const d=[];pts.forEach((p,i)=>{if(p.v!=null)d.push([X(i),Y(p.v)])});
  if(d.length>1){
    const path=d.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
    g+='<path class="area" d="'+path+' L'+d[d.length-1][0].toFixed(1)+' '+Y(0)+' L'+d[0][0].toFixed(1)+' '+Y(0)+'Z"/><path class="ln '+(first?'anim':'')+'" pathLength="1" d="'+path+'"/>';
  }
  const sp=pts[sel]||{m:curYM(),v:0};
  if(sp.v!=null)g+='<line class="guide" x1="'+X(sel)+'" x2="'+X(sel)+'" y1="'+T+'" y2="'+(T+ih)+'"/>';
  pts.forEach((p,i)=>{if(p.v!=null)g+='<circle class="dot '+(i===sel?'s':'')+'" cx="'+X(i)+'" cy="'+Y(p.v)+'" r="'+(i===sel?6:3.5)+'"/>'});
  const cw=iw/Math.max(1,n-1);
  pts.forEach((p,i)=>{if(p.v!=null)g+='<rect class="hit" data-a="chartPick" data-i="'+i+'" x="'+(X(i)-cw/2)+'" y="'+T+'" width="'+cw+'" height="'+(ih+B)+'"/>'});
  let mom='';const prev=pts[sel-1];
  if(prev&&prev.v!=null&&sp.v!=null){
    const diff=sp.v-prev.v;
    if(diff===0)mom='<div class="mom flat">'+ic('minus')+'Same as '+mShort(prev.m)+'</div>';
    else if(prev.v>0)mom='<div class="mom '+(diff>0?'up':'down')+'">'+ic(diff>0?'up2':'down2')+Math.round(Math.abs(diff)/prev.v*100)+'% vs '+mShort(prev.m)+'</div>';
    else mom='<div class="mom up">'+ic('up2')+'Up from '+inr(0)+' in '+mShort(prev.m)+'</div>';
  }
  const val=sp.v==null?0:sp.v;
  const tag=mode==='session'?Math.round(drawn.length/Math.max(1,pts.length)*100)+'% of session':'Last 6 months';
  return '<div class="ch-head"><div><small>'+(mode==='session'?'Session progress':'Fees collected')+'</small><div class="ch-val">'+(first?cnt(val,true):'<span class="num">'+inr(val)+'</span>')+'</div><small style="display:block">'+mLabel(sp.m)+'</small>'+mom+'</div><span class="pill ac">'+tag+'</span></div>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fees collected by month">'+g+'</svg>';
}

function activityItems(){
  const a=[];
  for(const x of allTx())a.push({d:String(x.t.date),k:'pay',name:nm(x.owner),amt:x.t.amount,mode:x.t.mode,id:x.t.id});
  state.tests.forEach(t=>a.push({d:t.date,k:'test',name:t.name,sub:t.class,id:t.id}));
  state.students.forEach(s=>{if(s.addedDate)a.push({d:s.addedDate,k:'add',name:s.name,id:s.id});if(s.leftDate)a.push({d:s.leftDate,k:'left',name:s.name,id:s.id})});
  return a.sort((x,y)=>y.d.localeCompare(x.d));
}
function activityHTML(){
  const l=activityItems();
  const shown=more.activity?l.slice(0,15):l.slice(0,3);
  const row=a=>{
    const cfg={pay:['act-ic pay','card',esc(a.name)+' paid '+inr(a.amt),fmtDate(a.d)+(a.mode?' · '+esc(a.mode):''),'payOpen'],
      test:['act-ic','file','Test added: '+esc(a.name),fmtDate(a.d)+(a.sub?' · '+esc(a.sub):''),'testOpen'],

    (l.length>3?'<button class="more" data-a="moreToggle" data-w="activity">'+(more.activity?'Show less':'Tap to show more')+'</button>':'')+'</div>';
}

function homeResults(q){
  q=norm(q);if(!q)return '';
  const st=state.students.filter(s=>[s.name,s.father,s.mother,s.admissionNo,clsLabel(s)].some(v=>norm(v).includes(q))).sort(byName).slice(0,6);
  const pay=allTx().filter(x=>[nm(x.owner),x.t.mode,x.t.remark,String(x.t.amount)].some(v=>norm(v).includes(q))).sort((a,b)=>String(b.t.date).localeCompare(String(a.t.date))).slice(0,6);
  const ts=state.tests.filter(t=>[t.name,t.subject,t.class].some(v=>norm(v).includes(q))).slice(0,6);
  let h='';
  if(st.length)h+='<div class="sect"><h2>Students</h2></div><div class="list">'+st.map(s=>'<button class="row" data-a="stu" data-id="'+s.id+'">'+avatar(s.name,stuColor(s))+'<span class="grow"><b>'+esc(s.name)+'</b><small>'+esc(clsLabel(s))+(s.leftDate?' · Left':'')+'</small></span>'+ic('chevR')+'</button>').join('')+'</div>';
  if(pay.length)h+='<div class="sect"><h2>Payments</h2></div><div class="list">'+pay.map(x=>'<button class="row" data-a="payOpen" data-id="'+x.t.id+'"><span class="act-ic pay">'+ic('card')+'</span><span class="grow"><b>'+esc(nm(x.owner))+'</b><small>'+fmtDate(x.t.date)+(x.t.mode?' · '+esc(x.t.mode):'')+'</small></span><span class="end"><b class="num">'+inr(x.t.amount)+'</b></span></button>').join('')+'</div>';
  if(ts.length)h+='<div class="sect"><h2>Tests</h2></div><div class="list">'+ts.map(t=>'<button class="row" data-a="testOpen" data-id="'+t.id+'"><span class="act-ic">'+ic('file')+'</span><span class="grow"><b>'+esc(t.name)+'</b><small>'+esc(t.class)+(t.subject?' · '+esc(t.subject):'')+' · '+fmtDate(t.date)+'</small></span>'+ic('chevR')+'</button>').join('')+'</div>';
  return h||'<div class="empty">'+ic('search')+'<b>No matches</b><small>Try a name, class, amount or payment mode.</small></div>';
}

ACT.saveStudent=el=>{
  const id=el.dataset.id,name=$('#f_name').value.trim();
  if(!name){toast('Enter the student’s name','err');$('#f_name').focus();return}
  const contacts=$$('.c-in').map(i=>i.value.trim()).filter(Boolean);
  const mems=$$('#mems .inrow').map(r=>({class:$('.m-class',r).value,subject:$('.m-sub',r).value.trim()})).filter(m=>m.class);
  if(!mems.length){toast('Choose at least one class','err');return}
  const feeType=document.querySelector('input[name=ft]:checked').value;
  const totalFees=num($('#f_total').value),monthlyFee=num($('#f_month').value);
  if(totalFees<0||monthlyFee<0){toast('Fee cannot be negative','err');return}
  const data={name,admissionNo:$('#f_adm').value.trim(),father:$('#f_father').value.trim(),mother:$('#f_mother').value.trim(),contacts:contacts.length?contacts:[''],remarks:$('#f_rem').value.trim(),feeType,totalFees,monthlyFee,addedDate:$('#f_added').value||today()};
  if(id){
    const s=byId(id);if(!s)return;
    Object.assign(s,data);s.memberships=mems.map(m=>({class:m.class,subject:m.subject,status:s.leftDate?'inactive':'active'}));
  }else{
    state.students.push(Object.assign({id:uid(),leftDate:'',transactions:[],memberships:mems.map(m=>({class:m.class,subject:m.subject,status:'active'}))},data));
  }
  save();toast(id?'Student updated':'Student added');back();
};

ACT.leftStu=async el=>{

  if(!await confirmDlg('Mark '+s.name+' as left?','Their payments, tests and history stay on record. You can restore them any time.','Mark as left',false))return;

ACT.restoreStu=el=>{const s=byId(el.dataset.id);if(!s)return;s.leftDate='';s.memberships.forEach(m=>m.status='active');save();toast('Student restored');render(true)};
ACT.delStu=async el=>{
  const s=byId(el.dataset.id);if(!s)return;
  if(s.transactions.length){
    const c=await chooseSheet('Delete '+s.name+'?',[
      {v:'keep',label:'Delete student, keep payment history',sub:'Payments stay in the ledger and exports, marked as Left',icon:'archive'},
      {v:'all',label:'Delete everything permanently',sub:'The student and all their payments are removed',icon:'trash',danger:true}],
      'This student has '+s.transactions.length+' recorded payment'+(s.transactions.length>1?'s':'')+'.');
    if(!c)return;
    if(c==='all'&&!await confirmDlg('Delete permanently?','All payments for '+esc(s.name)+' will be lost. This cannot be undone.','Delete everything'))return;
    if(c==='keep')state.leftStudentTransactions.push({id:uid(),originalName:s.name,admissionNo:s.admissionNo,father:s.father,mother:s.mother,classLabel:clsLabel(s),deletedDate:today(),transactions:clone(s.transactions)});
  }else if(!await confirmDlg('Delete '+s.name+'?','This removes the student from your roster. This cannot be undone.','Delete'))return;
  state.students=state.students.filter(x=>x.id!==s.id);
  state.tests.forEach(t=>{delete t.marks[s.id];delete t.absent[s.id]});
  save();toast('Student deleted');back();
};

TABS.payments=function(){
  const total=totalReceived(),avg=total/sessionMonthsElapsed();
  const remaining=state.students.filter(isActive).reduce((a,s)=>a+balOf(s),0);
  return{
    title:'Payments',
    actions:'<button class="ib" data-a="exportXlsx" aria-label="Export to Excel">'+ic('down')+'</button>',
    html:'<div class="wrap"><div class="stats3" style="margin-bottom:.9rem">'+
      '<div class="stat"><small>Total received</small><b>'+cnt(total,true)+'</b></div>'+
      '<div class="stat"><small>Average / month</small><b>'+cnt(avg,true)+'</b></div>'+
      '<div class="stat"><small>Fees remaining</small><b class="bal '+(remaining?'':'zero')+'">'+cnt(remaining,true)+'</b></div></div>'+
      '<div class="searchbar">'+ic('search')+'<input id="q" type="search" placeholder="Search payments" autocomplete="off" value="'+esc(Q.payments)+'"></div>'+
      '<div id="list"></div></div><button class="fab" data-a="qaPay">'+ic('plus')+'Record payment</button>',
    after(){
      const draw=()=>{
        const q=norm(Q.payments);
        let l=allTx();
        if(q)l=l.filter(x=>[nm(x.owner),x.label,x.t.remark,x.t.mode,String(x.t.amount),fmtDate(x.t.date),x.t.date].some(v=>norm(v).includes(q)));
        l.sort((a,b)=>String(b.t.date).localeCompare(String(a.t.date)));
        if(!l.length){$('#list').innerHTML='<div class="empty">'+ic('card')+'<b>'+(q?'No payments match':'No payments yet')+'</b><small>'+(q?'Try a different search.':'Record a payment to start your ledger.')+'</small></div>';return}
        let h='',cur='';
        for(const x of l){
          const d=String(x.t.date);
          if(d!==cur){if(cur)h+='</div>';cur=d;h+='<div class="day">'+esc(friendlyDay(d))+'</div><div class="list">'}
          const stu=x.left?null:x.owner;
          h+='<div class="row"><button class="rowmain" data-a="payOpen" data-id="'+x.t.id+'">'+avatar(nm(x.owner),stu?stuColor(stu):'')+'<span class="grow"><b>'+esc(nm(x.owner))+(x.left?' <span class="pill warn">Left</span>':'')+'</b><small>'+esc(x.label)+(x.t.mode||x.t.remark?' · '+esc(x.t.mode||x.t.remark):'')+'</small></span><span class="end"><b class="num">'+inr(x.t.amount)+'</b></span></button><button class="ib" data-a="payEdit" data-id="'+x.t.id+'" aria-label="Edit payment">'+ic('edit')+'</button></div>';
        }
        $('#list').innerHTML=h+'</div>';
      };
      $('#q').oninput=e=>{Q.payments=e.target.value;draw()};draw();
    }
  };
};

ACT.exportXlsx=()=>{

ACT.doExport=()=>{
  const f=$('#x_from').value,t=$('#x_to').value;
  if(!f||!t||f>t){toast('Choose a valid date range','err');return}
  const l=allTx().filter(x=>String(x.t.date)>=f&&String(x.t.date)<=t).sort((a,b)=>String(a.t.date).localeCompare(String(b.t.date)));
  if(!l.length){toast('No payments in that range','err');return}
  const rows=[['Student','Class','Date','Amount (₹)','Mode','Remark']];
  let sum=0;
  l.forEach(x=>{sum+=+x.t.amount||0;rows.push([nm(x.owner)+(x.left?' (Left)':''),x.label,String(x.t.date),+x.t.amount||0,x.t.mode||'',x.t.remark||''])});
  rows.push(['Total','','',sum,'','']);
  download(makeXlsx('Payments',rows),'payments_'+f+'_to_'+t+'.xlsx');
  closeOverlay();toast('Exported '+l.length+' payment'+(l.length>1?'s':''));
};

ACT.savePay=el=>{
  const amt=num($('#p_amt').value),date=$('#p_date').value,mode=$('#p_mode').value,remark=$('#p_rem').value.trim();
  if(!(amt>0)){toast('Enter an amount greater than 0','err');$('#p_amt').focus();return}
  if(!date){toast('Choose the payment date','err');return}
  const tid=el.dataset.tid;
  if(tid){
    const x=findTx(tid);if(!x)return;
    Object.assign(x.t,{amount:amt,date,mode,remark});save();toast('Payment updated');
    const prev=stack[stack.length-2];

/* --- canvas-drawn receipt / statement image --- */
function receiptCanvas(o){
  const W=1000,M=40,P=52,ff=(FONTS[state.appFont]||FONTS.system).s;
  const ink='#141A26',mut='#5B6578',line='#E3E8F0',acc='hsl('+state.accentHue+' 70% 38%)',accSoft='hsl('+state.accentHue+' 80% 94%)';
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const F=(w,s)=>w+' '+s+'px '+ff;
  const wrap=(t,maxW,f)=>{x.font=f;const words=String(t).split(/\s+/),out=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(x.measureText(test).width>maxW&&cur){out.push(cur);cur=w}else cur=test}if(cur)out.push(cur);return out};
  const rr=(x0,y0,w,h,r)=>{x.beginPath();x.moveTo(x0+r,y0);x.arcTo(x0+w,y0,x0+w,y0+h,r);x.arcTo(x0+w,y0+h,x0,y0+h,r);x.arcTo(x0,y0+h,x0,y0,r);x.arcTo(x0,y0,x0+w,y0,r);x.closePath()};
  function layout(draw,H){
    const L=M+P,R=W-M-P,IW=R-L;let y=M;
    const T=(t,px,py,f,col,al)=>{if(!draw)return;x.font=f;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)};
    const HR=yy=>{if(!draw)return;x.fillStyle=line;x.fillRect(L,yy,IW,2)};
    if(draw){
      x.fillStyle='#EDF0F6';x.fillRect(0,0,W,H);
      x.save();x.shadowColor='rgba(20,26,38,.12)';x.shadowBlur=30;x.shadowOffsetY=10;rr(M,M,W-2*M,H-2*M,30);x.fillStyle='#fff';x.fill();x.restore();
      x.save();rr(M,M,W-2*M,H-2*M,30);x.clip();x.fillStyle='#10141C';x.fillRect(M,M,W-2*M,170);x.fillStyle=acc;x.fillRect(M,M+170,W-2*M,6);x.restore();
    }
    T(state.brand||'Tuition',L,M+82,F(800,46),'#FFFFFF');
    T(o.kind==='single'?'Payment receipt':'Fee statement',L,M+128,F(500,26),'hsl('+state.accentHue+' 88% 74%)');
    y=M+176+56;
    T(o.name,L,y,F(700,38),ink);y+=40;
    T((o.adm?'Adm. No. '+o.adm+'   ':'')+o.cls,L,y,F(400,25),mut);
    T(fmtDate(today()),R,y-40,F(500,24),mut,'right');
    y+=36;HR(y);y+=48;
    if(o.kind==='single'){
      const r=o.rows[0];
      [['Date',fmtDate(r.date)],['Payment mode',r.mode||'—']].concat(r.remark?[['Remark',r.remark]]:[]).forEach(kv=>{
        T(kv[0],L,y,F(400,26),mut);
        const lines=wrap(kv[1],IW-240,F(600,26));lines.forEach((ln,i)=>T(ln,R,y+i*34,F(600,26),ink,'right'));
        y+=Math.max(1,lines.length)*34+14;
      });
      y+=8;
      if(draw){rr(L,y,IW,150,22);x.fillStyle=accSoft;x.fill()}
      T('Amount received',L+34,y+52,F(500,26),mut);
      T(inr(r.amount),L+34,y+118,F(800,64),acc);
      y+=150+40;
    }else{
      T('Date',L,y,F(600,22),mut);T('Mode / remark',L+190,y,F(600,22),mut);T('Amount',R,y,F(600,22),mut,'right');y+=18;HR(y);y+=44;
      let sum=0;
      o.rows.forEach(r=>{
        sum+=+r.amount||0;
        T(fmtDate(r.date),L,y,F(500,25),ink);
        const d=[r.mode,r.remark].filter(Boolean).join(' · ')||'—';
        const ln=wrap(d,IW-190-230,F(400,24));
        ln.forEach((l2,i)=>T(l2,L+190,y+i*32,F(400,24),mut));
        T(inr(r.amount),R,y,F(700,26),ink,'right');
        y+=Math.max(1,ln.length)*32+18;
      });
      HR(y-6);y+=34;
      T('Total paid',L,y,F(700,28),ink);T(inr(sum),R,y,F(800,32),acc,'right');y+=52;
    }
    if(o.fee){
      const bw=(IW-2*16)/3,cols=[[o.fee.label,inr(o.fee.total),ink],['Paid',inr(o.fee.paid),ink],['Balance',inr(o.fee.bal),o.fee.bal>0?'#C62828':'#12805F']];
      cols.forEach((c,i)=>{const bx=L+i*(bw+16);if(draw){rr(bx,y,bw,112,18);x.fillStyle='#F4F6FA';x.fill()}T(c[0],bx+22,y+40,F(500,22),mut);T(c[1],bx+22,y+86,F(800,30),c[2])});
      y+=112+44;
    }
    HR(y);y+=44;
    T('Thank you',L,y,F(700,26),ink);y+=38;
    const who=[state.teacher,state.teacherWhatsapp&&'WhatsApp '+state.teacherWhatsapp,state.teacherEmail,state.teacherInstagram&&'Instagram '+state.teacherInstagram,state.teacherYoutube&&'YouTube '+state.teacherYoutube].filter(Boolean);
    who.forEach(w=>{T(w,L,y,F(400,23),mut);y+=33});
    if(state.teacherAddress)wrap(state.teacherAddress,IW,F(400,23)).forEach(ln=>{T(ln,L,y,F(400,23),mut);y+=33});
    return y+M+P/2;
  }
  const H=Math.ceil(layout(false));cv.width=W;cv.height=H;layout(true,H);
  return cv;
}

async function remindFlow(sid){
  const s=byId(sid);if(!s)return;
  const dflt=balOf(s)||feeAmt(s);
  const v=await promptSheet({title:'Send fee reminder',body:'Message goes to the parent of '+s.name+'.',label:'Amount to request (₹)',type:'number',value:dflt?String(dflt):'',ok:'Continue'});
  if(v===null)return;
  const amt=num(v);if(!(amt>0)){toast('Enter an amount greater than 0','err');return}
  let qr=null;
  if(state.qrCodeDataUrl||state.upiId){
    const opts=[];
    if(state.qrCodeDataUrl)opts.push({v:'saved',label:'Include my saved QR code',icon:'check'});
    opts.push({v:'upload',label:'Upload a QR for this message only',icon:'up'});
    opts.push({v:'none',label:'Text only, no QR',icon:'chat'});
    const c=await chooseSheet('Include a payment QR?',opts);
    if(!c)return;
    if(c==='saved')qr=state.qrCodeDataUrl;
    else if(c==='upload'){qr=await pickImage();if(!qr)return}
  }
  let msg='Dear Parent, fee update for '+s.name+' ('+clsLabel(s)+'):\n'+(s.feeType==='monthly'?'Monthly fee':'Total fee')+': '+inr(feeAmt(s))+'\nPaid till date: '+inr(paidOf(s))+'\nAmount requested ('+MONTHS[new Date().getMonth()]+'): '+inr(amt)+'\nKindly pay at the earliest convenience.';
  if(state.upiId)msg+='\nUPI ID: '+state.upiId;
  if(qr)msg+='\n(QR code attached)';
  msg+='\n\n'+[state.teacher,state.brand].filter(Boolean).join(', ');
  await deliverWA(s,msg,qr);
}
async function deliverWA(s,text,qr){
  const nums=(s.contacts||[]).map(c=>String(c).trim()).filter(Boolean);
  let num1=null;
  if(nums.length===1)num1=nums[0];
  else if(nums.length>1){num1=await chooseSheet('Send to which number?',nums.map(n=>({v:n,label:n,icon:'phone'})));if(!num1)return}
  if(qr){
    try{
      const blob=await(await fetch(qr)).blob();
      const f=new File([blob],'payment-qr.png',{type:blob.type||'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f],text})){await navigator.share({files:[f],text});return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  if(num1){window.open('https://wa.me/'+waNumber(num1)+'?text='+encodeURIComponent(text),'_blank');return}
  if(navigator.share){try{await navigator.share({text})}catch(e){}return}
  await copyText(text);toast('No phone number on file. Message copied, paste it in any app.');
}

function readMarks(max,scope){
  const marks={},absent={};let bad=null;
  $$('.mk',scope).forEach(i=>{
    const sid=i.dataset.sid,v=i.value.trim();
    if(v===''){absent[sid]=true;return}
    const n=parseFloat(v);
    if(isNaN(n)||n<0||n>max){if(!bad)bad=i;return}
    marks[sid]=n;
  });
  if(bad){bad.focus();toast('Marks must be between 0 and '+fmtN(max),'err');return null}
  return{marks,absent};
}

let AT=null,attTok=0;
function attStats(rec,month,s){
  const dim=daysInMonth(month),t=today(),work=[];let hol=0;
  for(let d=1;d<=dim;d++){const dt=month+'-'+pad(d);if(dt>t)break;if(rec.holidays.includes(dt))hol++;else work.push(dt)}
  const mine=s?work.filter(d=>d>=(s.addedDate||'')):work;
  const ab=s?mine.filter(d=>rec.records[d]&&rec.records[d][s.id]==='absent'):[];
  return{work,hol,total:mine.length,absent:ab,present:mine.length-ab.length,pct:mine.length?Math.round((mine.length-ab.length)/mine.length*100):null};
}
PAGES.attendance=function(a){

  const date0=(a&&a.date)||today();
  return{title:'Attendance',html:'<div class="wrap narrow"><div class="two stack"><label class="f">Class<select class="inp" id="at_cls" data-ch="attSel">'+classOptions(cls0)+'</select></label><label class="f">Date<input class="inp" type="date" id="at_date" data-ch="attSel" max="'+today()+'" value="'+date0+'"></label></div><div id="attBody" style="margin-top:1rem"></div></div>',
    after(){attLoad(cls0,date0)}};
};

async function attLoad(cls,date){
  const tok=++attTok,month=date.slice(0,7);

  AT={cls,date,month,rec,absent:new Set(Object.keys(rec.records[date]||{}))};
  drawAtt();
}
function attCounts(){
  const n=rosterOf(AT.cls).length,a=[...AT.absent].filter(id=>byId(id)).length;
  return (n-a)+' present, '+a+' absent';
}
function drawAtt(){
  const box=$('#attBody');if(!box||!AT)return;
  const {cls,date,month,rec}=AT,hol=rec.holidays.includes(date),saved=!!rec.records[date];
  const roster=rosterOf(cls);
  const summaryBtn='<button class="btn ghost big" style="margin-top:.8rem" data-a="attSummaryGo">'+ic('bars')+'Monthly summary for '+esc(mLabel(month))+'</button>';
  if(hol){
    box.innerHTML='<div class="notice">'+ic('info')+'<div><b>Tuition off on '+fmtDate(date)+'</b><br><small>This day does not count as a working day for '+esc(cls)+'.</small></div></div><div class="btns" style="margin-top:.9rem"><button class="btn primary" data-a="attResume">Resume tuition</button><button class="btn danger" data-a="attRedo">Redo day</button></div>'+summaryBtn;
    return;
  }
  box.innerHTML=(roster.length?'<div class="sect" style="margin-top:0"><h2>'+esc(cls)+', '+esc(friendlyDay(date))+'</h2><span class="pill" id="attCount">'+attCounts()+'</span></div><div class="list">'+roster.map(s=>'<div class="attrow">'+avatar(s.name,stuColor(s),'sm')+'<span class="grow"><b>'+esc(s.name)+'</b></span><button class="tog '+(AT.absent.has(s.id)?'on':'')+'" data-a="attToggle" data-id="'+s.id+'">'+(AT.absent.has(s.id)?'Absent':'Mark absent')+'</button></div>').join('')+'</div>':'<div class="empty">'+ic('users')+'<b>No active students in '+esc(cls)+'</b><small>Everyone is present by default. Only absences are recorded.</small></div>')+

async function buildBackup(){
  const att={};for(const k of await store.keys('att:')){const r=await store.getJ(k);if(r)att[k]=r}
  return{format:'tuition-manager-backup',version:1,exportedAt:new Date().toISOString(),state,attendance:att};
}
async function applyRestore(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('That file is not a valid backup','err');return false}
  if(!d||d.format!=='tuition-manager-backup'||!d.state||typeof d.state!=='object'){toast('That file is not a Tuition Manager backup','err');return false}
  const empty=!state.setupDone||(!state.students.length&&!state.tests.length&&!state.classes.length);
  if(!empty&&!await confirmDlg('Replace all data?','Restoring completely replaces everything on this device with the backup'+(d.exportedAt?' from '+esc(fmtDate(String(d.exportedAt).slice(0,10))):'')+'. Anything not in the backup is lost.','Replace everything'))return false;
  for(const k of await store.keys('att:'))await store.del(k);
  attCache.clear();
  for(const k of Object.keys(d.attendance||{}))if(k.startsWith('att:'))await store.setJ(k,d.attendance[k]);
  state=normalizeState(d.state);state.loggedOut=false;
  await flush();applyTheme();stack=[];tab='home';chartSel=null;
  toast('Backup restored');renderRoot();return true;
}
const driveOn=()=>!!GOOGLE_CLIENT_ID&&(location.protocol==='https:'||location.hostname==='localhost');
let gTok=null,gExp=0;
function loadGIS(){
  return new Promise((ok,no)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>ok();s.onerror=()=>no(new Error('Could not reach Google. Check your connection.'));document.head.append(s);
  });
}
async function driveAuth(interactive){
  if(gTok&&Date.now()<gExp)return gTok;
  await loadGIS();
  return new Promise((ok,no)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return no(new Error('Google sign-in failed'));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;localStorage.setItem('tm-drive','1');ok(gTok)},
      error_callback:()=>no(new Error('Google sign-in was cancelled'))});
    tc.requestAccessToken({prompt:interactive?'consent':''});
  });
}
async function driveFind(tok){
  const q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name,modifiedTime)',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
  const j=await r.json();return j.files&&j.files[0]||null;
}
ACT.driveConnect=async()=>{try{await driveAuth(true);toast('Google Drive connected');render(true)}catch(e){toast(e.message,'err')}};
ACT.driveDisconnect=async()=>{
  try{if(gTok&&window.google)google.accounts.oauth2.revoke(gTok)}catch(e){}
  gTok=null;localStorage.removeItem('tm-drive');toast('Google Drive disconnected');render(true);
};
ACT.driveBackup=async()=>{
  try{
    const tok=await driveAuth(false);
    state.lastBackupAt=new Date().toISOString();state.lastDriveSync=state.lastBackupAt;await flush();
    const body=JSON.stringify(await buildBackup()),f=await driveFind(tok);
    let r;
    if(f)r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body});
    else{
      const b='tmboundary'+Date.now();
      r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},
        body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'});
    }
    if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
    toast('Backed up to Google Drive');render(true);
  }catch(e){toast(e.message||'Drive backup failed','err')}
};
ACT.driveRestore=async()=>{
  try{
    const tok=await driveAuth(false),f=await driveFind(tok);
    if(!f){toast('No backup found in your Google Drive','err');return}
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
    await applyRestore(await r.text());
  }catch(e){toast(e.message||'Drive restore failed','err')}
};
PAGES.backup=function(){
  const last=state.lastBackupAt,due=!last||daysSince(last)>=7;
  const drive=!GOOGLE_CLIENT_ID?'<div class="card"><h3>Google Drive</h3><p class="muted" style="margin-top:.3rem">Automatic cloud backup is switched off. To turn it on, paste a Google OAuth web client ID into GOOGLE_CLIENT_ID at the top of the app’s script and host the app over https.</p></div>':
    !driveOn()?'<div class="card"><h3>Google Drive</h3><p class="muted" style="margin-top:.3rem">Google Drive backup needs the app to be opened from an https address, not from a file on your device.</p></div>':
    '<div class="card"><h3>Google Drive</h3><p class="muted" style="margin:.3rem 0 .8rem">Keeps one backup file in your own Drive. Nothing else in Drive is touched.'+(state.lastDriveSync?' Last synced '+ago(state.lastDriveSync)+'.':'')+'</p>'+
    (localStorage.getItem('tm-drive')?'<div class="btns"><button class="btn primary" data-a="driveBackup">'+ic('up')+'Back up to Drive</button><button class="btn" data-a="driveRestore">'+ic('down')+'Restore from Drive</button><button class="btn ghost" data-a="driveDisconnect">Disconnect</button></div>':'<button class="btn primary big" data-a="driveConnect">'+ic('cloud')+'Connect Google Drive</button>')+'</div>';
  return{title:'Backup & Restore',html:'<div class="wrap narrow">'+
    '<div class="'+(due?'notice bad':'card')+'">'+(due?ic('alert'):'')+'<div><b>'+(last?'Last backup '+ago(last):'No backup yet')+'</b><br><small>'+(due?'Back up now so a lost or reset phone doesn’t take your records with it.':'Your data is safe as of that backup.')+'</small></div></div>'+
    '<p class="muted" style="margin:.9rem .2rem">Everything lives only on this device. If you uninstall the app or clear browser data, it is gone for good and there is no server copy. A backup file is your only safety net.</p>'+
    '<div class="btns"><button class="btn primary" data-a="doBackup">'+ic('down')+'Backup data</button><button class="btn" data-a="restoreBtn">'+ic('up')+'Restore backup</button></div><input type="file" id="rs_file" accept=".json,application/json" class="hidden" data-ch="restoreFile">'+
    '<div style="margin-top:1rem">'+drive+'</div></div>'};
};
ACT.doBackup=async()=>{
  state.lastBackupAt=new Date().toISOString();await flush();

function setupHTML(){
  const now=new Date(),sy=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
  return '<div class="center-screen"><div class="setup"><div class="logo">T</div><div><h1>Set up Tuition Manager</h1><p class="muted">A few details and you’re ready. You can change any of them later.</p></div>'+
  '<div class="fgroup"><label class="f">Your name *<input class="inp" id="su_name" autocomplete="name"></label><label class="f">Institute name *<input class="inp" id="su_brand" placeholder="For example, Sharma Tuition Classes"></label><div class="seg"><label><input type="radio" name="sg" value="male" checked><span>Sir</span></label><label><input type="radio" name="sg" value="female"><span>Ma’am</span></label></div></div>'+
  '<div class="fgroup"><h4>Academic session</h4><div class="two stack"><label class="f">Starts *<input class="inp" type="month" id="su_start" value="'+sy+'-04"></label><label class="f">Ends *<input class="inp" type="month" id="su_end" value="'+(sy+1)+'-03"></label></div></div>'+
  '<div class="fgroup"><h4>Your classes *</h4><div class="inrow"><input class="inp" id="su_cls" placeholder="For example, 9th CBSE"><button class="btn" data-a="suAdd">Add</button></div><div class="chipbox" id="su_chips"></div></div>'+
  '<button class="btn primary big" data-a="suFinish">Start using the app</button>'+
  '<button class="btn ghost big" data-a="suRestore">'+ic('up')+'Restore from a backup file</button><input type="file" id="su_file" accept=".json,application/json" class="hidden" data-ch="restoreFile"></div></div>';
}
function drawSuChips(){$('#su_chips').innerHTML=suClasses.map((c,i)=>'<span class="chipx">'+esc(c)+'<button data-a="suRm" data-i="'+i+'" aria-label="Remove '+esc(c)+'">'+ic('x')+'</button></span>').join('')}
function suAddPending(){
  const inp=$('#su_cls'),v=inp.value.trim();if(!v)return true;
  if(suClasses.some(c=>norm(c)===norm(v))){toast('You already added that class','err');return false}
  suClasses.push(v);inp.value='';drawSuChips();return true;
}
function bindSetup(){
  suClasses=[];drawSuChips();
  $('#su_cls').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();suAddPending()}});
}
ACT.suRestore=()=>$('#su_file').click();
ACT.suAdd=()=>{suAddPending();$('#su_cls').focus()};
ACT.suRm=el=>{suClasses.splice(+el.dataset.i,1);drawSuChips()};
ACT.suFinish=async()=>{
  const name=$('#su_name').value.trim(),brand=$('#su_brand').value.trim(),s=$('#su_start').value,e=$('#su_end').value;
  if(!name){toast('Enter your name','err');$('#su_name').focus();return}
  if(!brand){toast('Enter your institute name','err');$('#su_brand').focus();return}
  if(!s||!e||s>e){toast('The session must start on or before its end','err');return}
  if(!suAddPending())return;
  if(!suClasses.length){toast('Add at least one class','err');$('#su_cls').focus();return}
  Object.assign(state,{teacher:name,brand,gender:document.querySelector('input[name=sg]:checked').value,sessionStart:s,sessionEnd:e,classes:suClasses.slice(),activeClass:'All',setupDone:true,loggedOut:false});
  await flush();toast('Welcome, '+name.split(/\s+/)[0]);renderRoot();
};
function lockHTML(){
  return '<div class="center-screen"><div class="lock">'+avatar(state.teacher,'','lg')+'<small>Welcome back</small><h1>'+esc(state.teacher)+'</h1><p class="muted">'+esc(state.brand)+'</p><button class="btn primary big" style="max-width:20rem;margin-top:.6rem" data-a="unlock">'+ic('lock')+'Unlock</button></div></div>';
}
ACT.unlock=async()=>{state.loggedOut=false;await flush();renderRoot()};

function renderRoot(){
  const full=$('#full'),shell=$('#shell');
  closeAllOverlays();closeDrawer();
  if(!state.setupDone){shell.hidden=true;full.hidden=false;full.innerHTML=setupHTML();bindSetup();return}
  if(state.loggedOut){shell.hidden=true;full.hidden=false;full.innerHTML=lockHTML();return}
  full.hidden=true;full.innerHTML='';shell.hidden=false;render();
}

/* =====================================================================
   THEME + BOOT
   ===================================================================== */
function applyTheme(){
  const t=state.theme==='system'?(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'):state.theme;
  const r=document.documentElement;
  r.dataset.theme=t;r.style.setProperty('--h',state.accentHue);
  r.style.setProperty('--font',(FONTS[state.appFont]||FONTS.system).s);
  r.style.setProperty('--scale',(state.textScale||100)/100);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#10141C':'#F1F4F9';
}
async function boot(){
  await store.init();
  storageOK=await store.selfCheck();
  try{
    const raw=await store.getRaw(STATE_KEY);
    if(raw){
      try{state=normalizeState(JSON.parse(raw))}
      catch(e){try{await store.setRaw('state-unreadable',raw)}catch(_){}toast('Saved data could not be read. A copy was kept aside.','err')}
    }
  }catch(e){console.error(e)}
  applyTheme();
  try{matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{if(state.theme==='system')applyTheme()})}catch(e){}
  $('#tabs').innerHTML=TAB_DEF.map(t=>'<button data-a="tab" data-t="'+t[0]+'">'+ic(t[1])+'<span>'+t[2]+'</span></button>').join('');
  initHistory();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  window.addEventListener('pagehide',()=>{flush()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  renderRoot();
}
boot();
</script>
</body>
</html>
