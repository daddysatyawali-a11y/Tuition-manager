<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuition Manager</title>
<meta name="description" content="Manage students, fees, tests and attendance for your tuition classes. Works offline, keeps data on your device.">
<meta name="theme-color" content="#10141C">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuition Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --h:210;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#10141C;--s1:#171C26;--s2:#1E2531;--s3:#283041;--line:#2B3446;
  --tx:#E8ECF3;--tx2:#A2ACBF;--tx3:#727D92;
  --ac:hsl(var(--h) 88% 68%);--ac-soft:hsl(var(--h) 70% 60% / .16);--ac-glow:hsl(var(--h) 90% 60% / .35);--ac-ink:#0A0F1A;
  --good:#4CC9A0;--warn:#F2B44B;--bad:#F87171;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#F1F4F9;--s1:#FFFFFF;--s2:#F4F6FA;--s3:#E7ECF4;--line:#DCE2EC;
  --tx:#141A26;--tx2:#4A5468;--tx3:#7A8499;
  --ac:hsl(var(--h) 72% 42%);--ac-soft:hsl(var(--h) 80% 45% / .11);--ac-glow:hsl(var(--h) 80% 45% / .28);--ac-ink:#FFFFFF;
  --good:#12805F;--warn:#A85F00;--bad:#C62828;
  --shadow:0 8px 24px rgba(20,26,38,.09);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);line-height:1.45;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:var(--ac)}
small{color:var(--tx2);font-size:.8rem}
h2{font-size:1.05rem;font-weight:650}
h3{font-size:1rem;font-weight:650}
h4{font-size:.9rem;font-weight:600;color:var(--tx2)}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.grow>b,.grow>small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow>b{font-weight:600}
.muted{color:var(--tx2)}
.bal{color:var(--bad)}
.bal.zero,.good{color:var(--good)}
.warn{color:var(--warn)}
svg.i{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{min-height:100dvh}
#main{min-height:100dvh;padding-bottom:calc(4.6rem + env(safe-area-inset-bottom))}
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.4rem;padding:calc(.55rem + env(safe-area-inset-top)) .8rem .55rem;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#bar h1{flex:1;font-size:1.1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ib{position:relative;width:2.6rem;height:2.6rem;border-radius:12px;display:grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover,.ib:active{background:var(--s2);color:var(--tx)}
.badge{position:absolute;top:.15rem;right:.1rem;min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center}
#banner .warnbar{background:color-mix(in srgb,var(--warn) 16%,var(--s1));color:var(--tx);border-bottom:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));padding:.65rem 1rem;font-size:.86rem;display:flex;gap:.6rem;align-items:flex-start}
#banner .warnbar svg{color:var(--warn);margin-top:.1rem}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:1rem}
.wrap.narrow{max-width:46rem}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.6rem 0 .5rem;font-size:.72rem;color:var(--tx3);font-weight:500}
#tabs button.on{color:var(--ac);font-weight:650}
#tabs button.on svg{filter:drop-shadow(0 0 8px var(--ac-glow))}
@media(max-width:899px){body.page #tabs{display:none}body.page #main{padding-bottom:1rem}}
@media(min-width:900px){
  #tabs{top:0;bottom:0;right:auto;width:5.5rem;flex-direction:column;justify-content:flex-start;gap:.3rem;padding:1.1rem .5rem;border-top:0;border-right:1px solid var(--line)}
  #tabs button{flex:none;border-radius:14px;padding:.7rem 0}
  #tabs button.on{background:var(--ac-soft)}
  #main{margin-left:5.5rem;padding-bottom:2rem}
}

/* ---------- drawer ---------- */
#drawer{position:fixed;inset:0;z-index:40;pointer-events:none}
#drawer .dscrim{position:absolute;inset:0;background:rgba(5,8,14,.6);opacity:0;transition:opacity .22s}
#drawer .dpanel{position:absolute;left:0;top:0;bottom:0;width:min(20rem,86vw);background:var(--s1);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{pointer-events:auto}
#drawer.open .dscrim{opacity:1}
#drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:.8rem;padding:calc(1.2rem + env(safe-area-inset-top)) 1.1rem 1.1rem;border-bottom:1px solid var(--line);width:100%}
.dhead b{display:block;font-size:1.02rem}
.dnav{padding:.6rem;display:flex;flex-direction:column;gap:.15rem}
.dnav button{display:flex;align-items:center;gap:.85rem;padding:.75rem .85rem;border-radius:12px;color:var(--tx2);font-weight:500;width:100%}
.dnav button:hover{background:var(--s2)}
.dnav button.on{background:var(--ac-soft);color:var(--ac);font-weight:650}
.dnav hr{border:0;border-top:1px solid var(--line);margin:.4rem .5rem}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:1.1rem}
.list{background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:.8rem;padding:.75rem 1rem;width:100%;border-bottom:1px solid var(--line);min-height:3.4rem}
.list>:last-child{border-bottom:0}
button.row:hover,button.row:active{background:var(--s2)}
.row .end{text-align:right;flex:none}
.row .end b{display:block}
.sect{display:flex;align-items:center;justify-content:space-between;margin:1.3rem 0 .6rem;gap:.5rem}
.sect:first-child{margin-top:.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.7rem}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:.95rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;text-align:left;width:100%;min-width:0}
.tile:hover{background:var(--s2)}
.tile .grow{width:100%}
.tile .bal,.tile b{font-size:.98rem}
.empty{text-align:center;padding:2.6rem 1rem;color:var(--tx2);display:flex;flex-direction:column;gap:.5rem;align-items:center}
.empty svg{width:2.2rem;height:2.2rem;color:var(--tx3)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:99px;background:var(--s3);color:var(--tx2);font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.ac{background:var(--ac-soft);color:var(--ac)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}

.av{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none;background:color-mix(in srgb,var(--c,var(--ac)) 26%,var(--s2));color:color-mix(in srgb,var(--c,var(--ac)) 78%,var(--tx))}
.av.lg{width:4.6rem;height:4.6rem;font-size:1.45rem}
.av.sm{width:2rem;height:2rem;font-size:.7rem}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.68rem 1.1rem;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--s2);text-align:center;line-height:1.2}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:.9rem}
.btn.sm{padding:.4rem .8rem;font-size:.86rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:.6rem;flex-wrap:wrap}
.btns>.btn{flex:1;min-width:10rem}
.inp{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:.68rem .85rem;outline:0;min-height:2.85rem}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
textarea.inp{min-height:5rem;resize:vertical}
.f{display:flex;flex-direction:column;gap:.35rem;font-size:.84rem;color:var(--tx2);min-width:0}
.f>.inp{color:var(--tx);font-size:1rem}
.form{display:flex;flex-direction:column;gap:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:430px){.two.stack{grid-template-columns:1fr}}
.fgroup{display:flex;flex-direction:column;gap:.55rem;padding:.9rem;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
.inrow{display:flex;gap:.5rem;align-items:center}
.searchbar{display:flex;align-items:center;gap:.6rem;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 .9rem;color:var(--tx3);margin-bottom:.75rem}
.searchbar:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.searchbar input{flex:1;background:none;border:0;outline:0;padding:.75rem 0;color:var(--tx);min-width:0}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.1rem 0 .8rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.2rem;padding:0 .95rem;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--tx2);white-space:nowrap;font-size:.88rem;flex:none;font-weight:500}
.chip .cnt{font-size:.75rem;opacity:.75}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:transparent;font-weight:650}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:.2rem;gap:.15rem}
.seg>label,.seg>button{flex:1}
.seg input{display:none}
.seg span,.seg>button{display:block;text-align:center;padding:.5rem .4rem;border-radius:9px;color:var(--tx2);font-weight:500;font-size:.92rem}
.seg input:checked+span,.seg>button.on{background:var(--ac);color:var(--ac-ink);font-weight:650}
.fab{position:fixed;right:1rem;bottom:calc(5.2rem + env(safe-area-inset-bottom));z-index:15;display:flex;gap:.5rem;align-items:center;padding:.85rem 1.15rem;border-radius:16px;background:var(--ac);color:var(--ac-ink);font-weight:650;box-shadow:0 10px 26px var(--ac-glow)}
body.page .fab{bottom:calc(1.2rem + env(safe-area-inset-bottom))}
@media(min-width:900px){.fab{bottom:1.6rem;right:1.6rem}body.page .fab{bottom:1.6rem}}
.savebar{position:sticky;bottom:0;padding:.8rem 0 calc(.6rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:.5rem}
.swatches{display:flex;flex-wrap:wrap;gap:.6rem}
.sw{width:2.3rem;height:2.3rem;border-radius:50%;border:2px solid transparent;background:var(--c);display:grid;place-items:center;color:#fff}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 3px var(--bg) inset}
.sw.none{background:var(--s3);color:var(--tx2)}
.sw svg{width:1rem;height:1rem;stroke:#fff}
.rng{width:100%;accent-color:var(--ac)}

/* ---------- overlays ---------- */
#ov .ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#ov .scrim{position:absolute;inset:0;background:rgba(5,8,14,.62);opacity:0;transition:opacity .2s}
#ov .ov.in .scrim{opacity:1}
#ov .sheet{position:relative;width:100%;max-width:34rem;max-height:90dvh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:1.2rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));transform:translateY(28px);opacity:0;transition:transform .22s,opacity .2s;box-shadow:var(--shadow)}
#ov .ov.in .sheet{transform:none;opacity:1}
#ov .ov.center{align-items:center}
#ov .ov.center .sheet{border-radius:22px;max-width:26rem;margin:1rem;width:calc(100% - 2rem)}
.sheet h3{margin-bottom:.4rem;font-size:1.1rem}
.sheet p{color:var(--tx2);margin-bottom:1rem;font-size:.95rem}
.sheet .opt{display:flex;align-items:center;gap:.8rem;width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:14px;margin-bottom:.55rem;background:var(--s2)}
.sheet .opt:hover{background:var(--s3)}
.sheet .opt.danger{color:var(--bad)}
.sheet .opt small{display:block}
.row-end{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.6rem + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
body.page #toasts{bottom:calc(1.6rem + env(safe-area-inset-bottom))}
.toast{background:var(--s3);color:var(--tx);border:1px solid var(--line);padding:.65rem 1rem;border-radius:12px;box-shadow:var(--shadow);animation:pop .22s;font-size:.92rem;transition:opacity .3s}
.toast.err{background:color-mix(in srgb,var(--bad) 22%,var(--s1));border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.toast.out{opacity:0}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* ---------- home ---------- */
.home{display:grid;gap:.9rem;grid-template-columns:1fr}
.hero{padding:.4rem .1rem 0}
.hero small{display:block}
.hero h2{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:.2rem 0 .9rem}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.qa button{display:flex;align-items:center;gap:.7rem;padding:.75rem .8rem;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:.92rem;line-height:1.2;text-align:left}
.qa button:hover{background:var(--s2)}
.qa .qi{flex:none;width:2.4rem;height:2.4rem;border-radius:12px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center}
.quote{padding:1.1rem 1.2rem;border-radius:20px;background:linear-gradient(135deg,var(--ac-soft),transparent 70%),var(--s1);border:1px solid var(--line)}
.quote{display:flex;flex-direction:column;justify-content:center}
.quote p{font-size:1.02rem;line-height:1.5;margin-bottom:.5rem}
.quote small{display:block}
.chartcard{cursor:pointer;padding:1.1rem 1.1rem .6rem;position:relative;overflow:hidden}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.ch-val{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:.15rem}
.chartcard .ch-head>span{flex:none}
.mom{display:inline-flex;align-items:center;gap:.3rem;margin-top:.35rem;font-size:.8rem;font-weight:600}
.mom.up{color:var(--good)}.mom.down{color:var(--bad)}.mom.flat{color:var(--tx2)}
.mom svg{width:1rem;height:1rem}
.chart{width:100%;height:auto;display:block;margin-top:.4rem;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.chart text{fill:var(--tx3);font-size:11px;font-family:inherit}
.chart text.sel{fill:var(--tx);font-weight:700}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px var(--ac-glow))}
.chart .ln.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out .1s forwards}
.chart .area{fill:url(#agrad);opacity:.9}
.chart .guide{stroke:var(--ac);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart .dot{fill:var(--bg);stroke:var(--ac);stroke-width:2.5}
.chart .dot.s{fill:var(--ac);stroke:var(--bg);stroke-width:3}
.chart rect.hit{fill:transparent;cursor:pointer}
@keyframes draw{to{stroke-dashoffset:0}}
.glance{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.glance button{position:relative;display:flex;flex-direction:column;gap:.15rem;padding:1rem;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left}
.glance button:hover{background:var(--s2)}
.glance .gi{color:var(--tx3);margin-bottom:.4rem}
.glance b{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.glance .badge{top:.9rem;right:.9rem;position:absolute}
.more{width:100%;padding:.7rem;color:var(--ac);font-size:.86rem;font-weight:600;text-align:center;border-top:1px solid var(--line)}
.banner-cta{display:flex;gap:.8rem;align-items:center;padding:1rem;border-radius:18px;border:1px dashed var(--ac);background:var(--ac-soft)}
.act-ic{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--tx2);flex:none}
.act-ic.pay{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.act-ic.left{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@media(min-width:900px){
  .home{grid-template-columns:repeat(12,1fr);gap:1rem}
  .home>*{grid-column:span 12}
  .home>.c4{grid-column:span 4}.home>.c5{grid-column:span 5}.home>.c6{grid-column:span 6}.home>.c7{grid-column:span 7}.home>.c8{grid-column:span 8}
  .qa{grid-template-columns:repeat(4,1fr)}
  .glance{grid-template-columns:repeat(4,1fr)}
  .hero h2{font-size:2.1rem}
  .hero-in{display:grid;grid-template-columns:1fr minmax(18rem,26rem);gap:1.5rem;align-items:end}
  .hero-in .searchbar{margin:0 0 .9rem}
}

.bchart{max-width:46rem;margin:1.1rem auto 0}
.bplot{position:relative;height:clamp(13rem,34vh,19rem);padding-top:1.2rem}
.bgrid{position:absolute;left:0;right:0;top:1.2rem;bottom:1.7rem;pointer-events:none}
.bgrid div{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.bgrid span{position:absolute;left:0;top:-.55rem;font-size:.64rem;line-height:1;color:var(--tx3);background:var(--s1);padding-right:.3rem}
.bcols{position:absolute;left:2.6rem;right:0;top:1.2rem;bottom:0;display:flex;align-items:stretch;justify-content:space-between;gap:clamp(.2rem,1.4vw,.7rem)}
.bcol{flex:1 1 0;min-width:0;max-width:4.6rem;display:flex;flex-direction:column;align-items:center;padding:0;margin:0 auto;background:none;border:0;cursor:pointer}
.bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bbar{position:relative;width:78%;border-radius:.45rem .45rem .2rem .2rem;background:var(--ac);opacity:.38;transition:height .95s cubic-bezier(.2,.8,.2,1),opacity .25s}
.bcol.sel .bbar{opacity:1}
.bval{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:.2rem;font-size:.66rem;font-weight:600;color:var(--tx2);white-space:nowrap;display:none}
.bcol.sel .bval{display:block;color:var(--ac)}
@media (min-width:640px){.bval{display:block}}
.blab{height:1.7rem;line-height:1.7rem;font-size:.7rem;color:var(--tx3)}
.bcol.sel .blab{color:var(--tx);font-weight:700}
.bcol:disabled{cursor:default}.bcol:disabled .blab{opacity:.4}
@media (prefers-reduced-motion:reduce){.bbar{transition:none}}
.ch-foot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.5rem}
.ch-foot b{font-size:.85rem;color:var(--ac)}
.meter{height:.6rem;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:.9rem}
.meter span{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .5s ease}
/* ---------- misc components ---------- */

/* ---------- storage (IndexedDB primary, localStorage fallback) ---------- */
const store={
  db:null,
  async init(){
    if('indexedDB' in window){
      try{
        this.db=await new Promise((ok,no)=>{
          const r=indexedDB.open('tuition-manager',1);
          r.onupgradeneeded=()=>r.result.createObjectStore('kv');
          r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('blocked'));
        });
      }catch(e){this.db=null}
    }
  },
  _req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async getRaw(k){
    if(this.db)return this._req(this.db.transaction('kv','readonly').objectStore('kv').get(k));
    const v=localStorage.getItem('tm:'+k);return v===null?undefined:v;
  },
  async setRaw(k,v){
    if(this.db)return new Promise((ok,no)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
    localStorage.setItem('tm:'+k,v);
  },
  async del(k){
    if(this.db)return new Promise((ok,no)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)});
    localStorage.removeItem('tm:'+k);
  },
  async keys(prefix=''){
    if(this.db){const all=await this._req(this.db.transaction('kv','readonly').objectStore('kv').getAllKeys());return all.filter(k=>String(k).startsWith(prefix))}
    const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tm:'+prefix))out.push(k.slice(3))}return out;
  },
  async getJ(k){const v=await this.getRaw(k);if(v==null)return null;try{return JSON.parse(v)}catch(e){return null}},
  setJ(k,o){return this.setRaw(k,JSON.stringify(o))},
  async selfCheck(){try{const v='t'+Date.now();await this.setRaw('__check',v);return (await this.getRaw('__check'))===v}catch(e){return false}}
};

/* ---------- attendance: one small record per class + month ---------- */
const attCache=new Map();
const attKey=(cls,m)=>'att:'+m+':'+cls;
async function getAtt(cls,m){
  const k=attKey(cls,m);if(attCache.has(k))return attCache.get(k);
  let r=null;try{r=await store.getJ(k)}catch(e){}
  if(!r||typeof r!=='object')r={holidays:[],records:{}};
  if(!Array.isArray(r.holidays))r.holidays=[];if(!r.records)r.records={};
  attCache.set(k,r);return r;
}
async function putAtt(cls,m,rec){const k=attKey(cls,m);attCache.set(k,rec);await store.setJ(k,rec)}
async function migrateAttendance(oldName,newName){
  const keys=await store.keys('att:');
  for(const k of keys){
    const m=k.slice(4,11),c=k.slice(12);
    if(c===oldName){
      const rec=await store.getJ(k);
      if(rec)await store.setJ(attKey(newName,m),rec);
      await store.del(k);attCache.delete(k);attCache.delete(attKey(newName,m));
    }
  }
}

/* ---- fee schedule and the ONE "overdue" rule used on Home, Alerts and the bell ----
   A fee is overdue only when its due date (the fee due day of that month) has passed and it is still unpaid.
   Payments are applied to the earliest installments first. Upcoming fees and the rest of the total never count. */
const ord=n=>{const t=['th','st','nd','rd'],v=n%100;return n+(t[(v-20)%10]||t[v]||t[0])};

function schedOf(s){
  if(s.free)return [];
  if(s.feeType==='monthly'){
    const f=+s.monthlyFee||0;if(!(f>0))return [];
    const a=(s.addedDate||today()).slice(0,7),b=(s.leftDate||today()).slice(0,7),out=[];
    for(let m=a;m<=b&&out.length<240;m=addMonths(m,1))out.push({month:m,amt:f});
    return out;
  }
  return planOf(s).slice().sort((x,y)=>String(x.month).localeCompare(String(y.month))).map(p=>({month:p.month,amt:r2(p.amount)})).filter(x=>x.amt>0);
}
function allocRows(rows,paid){
  let pool=r2(paid);
  return rows.map(r=>{const got=r2(Math.min(pool,r.amt));pool=r2(pool-got);return{month:r.month,amt:r.amt,got,rem:r2(r.amt-got)}});
}

  if(!isActive(s)||s.free)return null;
  const rows=allocRows(schedOf(s),paidOf(s)).filter(r=>r.rem>0&&isDuePassed(r.month));
  return rows.length?{total:r2(rows.reduce((a,r)=>a+r.rem,0)),rows}:null;
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cdSize=0;central.forEach(c=>cdSize+=c.length);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xlsxCol=i=>{let n=i+1,c='';while(n>0){const m=(n-1)%26;c=String.fromCharCode(65+m)+c;n=Math.floor((n-1)/26)}return c};

function makeXlsxMulti(sheets){

    while(used.has(n.toLowerCase())){const suf=' '+k++;n=base.slice(0,31-suf.length)+suf}
    used.add(n.toLowerCase());return n;
  });
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const sheetXml=sh=>{
    const rows=sh.rows,bold=new Set(sh.bold||[]),ncol=rows.reduce((m,r)=>Math.max(m,r.length),1),w=[];
    for(let c=0;c<ncol;c++){let m=8;rows.forEach(r=>{const v=r[c];if(v!=null&&v!=='')m=Math.max(m,Math.min(String(v).length,44))});w.push(m+2)}

  };

    {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'},
    {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+RNS+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',data:H+'<workbook xmlns="'+NS+'" xmlns:r="'+RNS+'"><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="20000" windowHeight="10000"/></bookViews><sheets>'+names.map((n,i)=>'<sheet name="'+x(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+RNS+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="'+RNS+'/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',data:H+'<styleSheet xmlns="'+NS+'"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'}
  ];

function closeOverlay(w){
  w=w||overlays[overlays.length-1];if(!w)return;

  setTimeout(()=>w.remove(),220);

function promptSheet(o){

    const inp=$('#ps_v',w);setTimeout(()=>{inp.focus();inp.select()},60);
    w._onclose=()=>fin(null);

    inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    w.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;if(b.dataset.r==='1')submit();else if(b.dataset.r==='x'){fin('');closeOverlay(w)}else closeOverlay(w)});
  });

function pickImage(){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';
    i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>shrinkImage(r.result).then(res);r.onerror=()=>res(null);r.readAsDataURL(f)};
    i.oncancel=()=>res(null);i.click();
  });
}
function shrinkImage(url,max=700){
  return new Promise(res=>{
    const im=new Image();im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/png'));
    };im.onerror=()=>res(url);im.src=url;
  });
}

/* --- count-up for headline numbers only --- */
function countUp(root){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-count]',root).forEach(el=>{
    const to=+el.dataset.count||0,money=el.dataset.money!=null;
    const fmt=v=>money?inr(v):Math.round(v).toLocaleString('en-IN');
    el.textContent=fmt(to);
    if(reduce||!to)return;
    const t0=performance.now(),D=750;
    const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(p<1?Math.round(to*e):to);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}
const cnt=(n,money)=>'<span class="num" data-count="'+(+n||0)+'"'+(money?' data-money':'')+'>0</span>';

/* =====================================================================
   Navigation: 4 tabs + slide-out drawer + page stack
   ===================================================================== */
let tab='home',stack=[],tabScroll={},rtok=0;
const TABS={},PAGES={};
const TAB_DEF=[['home','home','Home'],['students','users','Students'],['payments','card','Payments'],['tests','file','Tests']];
const DRAWER_DEF=[['attendance','clip','Attendance'],['classes','layers','Classes'],['ledger','card','Ledger'],['reports','bars','Reports'],['export','down','Export to Excel'],['backup','cloud','Backup & Restore'],['settings','sliders','Settings'],['about','info','About & Help']];
const navKey=()=>stack.length?stack[stack.length-1].nav:tab;

function go(p,a={},opts={}){
  const top=stack[stack.length-1];
  if(top)top.scroll=window.scrollY;else tabScroll[tab]=window.scrollY;
  stack.push({p,a,nav:opts.nav||(top?top.nav:tab)});
  render();
}
function replace(p,a={}){
  const top=stack[stack.length-1];
  stack[stack.length-1]={p,a,nav:top?top.nav:tab};render();
}
function back(){if(!stack.length)return false;stack.pop();render(true);return true}
function setTab(t){
  const same=!stack.length&&tab===t;closeAllOverlays();closeDrawer();
  if(!same)tabScroll[tab]=window.scrollY;
  stack=[];tab=t;render(false);
  if(same)window.scrollTo(0,0);
}
function openPage(p,a){closeDrawer();closeAllOverlays();stack=[];go(p,a||{},{nav:p})}

async function render(restore){
  if(!state.setupDone||state.loggedOut)return renderRoot();
  const tok=++rtok,top=stack[stack.length-1];
  let def;
  try{def=top?await PAGES[top.p](top.a||{}):await TABS[tab]()}
  catch(e){console.error(e);def={title:'Something went wrong',html:'<div class="wrap"><div class="empty">'+ic('alert')+'<b>This screen could not load.</b><small>'+esc(e.message||e)+'</small><button class="btn" data-a="back">Go back</button></div></div>'}}
  if(tok!==rtok)return;
  document.body.classList.toggle('page',!!top);
  const left=top?'<button class="ib" data-a="back" aria-label="Back">'+ic('chevL')+'</button>':'<button class="ib" data-a="openDrawer" aria-label="Open menu">'+ic('menu')+'</button>';
  $('#bar').innerHTML=left+'<h1>'+esc(def.title||'')+'</h1>'+(def.actions||'');
  $('#view').innerHTML=def.html;
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===navKey()));
  renderBanner();
  if(def.after)def.after();
  countUp($('#view'));
  const y=restore?(top?top.scroll:tabScroll[tab])||0:0;
  window.scrollTo(0,y);
}
function renderBanner(){
  let h='';
  if(!storageOK)h+='<div class="warnbar">'+ic('alert')+'<div><b>Your changes may not be saved.</b> This browser is blocking on-device storage. If you opened the file straight from Downloads, host it (for example on GitHub Pages) or open it over https, then use Backup regularly.</div></div>';

/* Back button / gesture: pops overlays, drawer, then the page stack. A cushion history entry keeps
   the browser from leaving the app on the first press. */
function logicalBack(){
  if(overlays.length){closeOverlay();return true}
  if($('#drawer').classList.contains('open')){closeDrawer();return true}
  if(stack.length){back();return true}
  return false;
}

}

let chartSel=null;const more={overdue:false,activity:false};

function chartModel(){
  const now=curYM();let months,mode;
  if(state.sessionStart&&state.sessionEnd&&state.sessionStart<=state.sessionEnd){months=monthRange(state.sessionStart,state.sessionEnd);mode='session'}
  else{months=monthRange(addMonths(now,-5),now);mode='six'}
  const by=feesByMonth();
  const pts=months.map(m=>({m,v:m<=now?(by[m]||0):null}));
  let sel=chartSel;
  if(sel==null||sel<0||sel>=pts.length||pts[sel].v==null){
    sel=pts.findIndex(p=>p.m===now);
    if(sel<0){sel=0;pts.forEach((p,i)=>{if(p.v!=null)sel=i})}
  }
  return{mode,pts,sel};
}
function chartInner(first){
  const {mode,pts,sel}=chartModel();
  const drawn=pts.filter(p=>p.v!=null),max=niceMax(Math.max(0,...drawn.map(p=>p.v)));
  const sp=pts[sel]||{m:curYM(),v:0};
  let mom='';const prev=pts[sel-1];
  if(prev&&prev.v!=null&&sp.v!=null){
    const diff=sp.v-prev.v;
    if(diff===0)mom='<div class="mom flat">'+ic('minus')+'Same as '+mShort(prev.m)+'</div>';
    else if(prev.v>0)mom='<div class="mom '+(diff>0?'up':'down')+'">'+ic(diff>0?'up2':'down2')+Math.round(Math.abs(diff)/prev.v*100)+'% vs '+mShort(prev.m)+'</div>';
    else mom='<div class="mom up">'+ic('up2')+'Up from '+inr(0)+' in '+mShort(prev.m)+'</div>';
  }
  const val=sp.v==null?0:sp.v;
  const tag=mode==='session'?Math.round(drawn.length/Math.max(1,pts.length)*100)+'% of session':'Last 6 months';
  const grid=[0,1,2,3,4].map(i=>'<div style="bottom:'+(i*25)+'%"><span>'+shortInr(max*i/4)+'</span></div>').join('');
  const cols=pts.map((p,i)=>{
    const h=p.v==null?0:(p.v>0?Math.max(1.5,Math.round(p.v/max*1000)/10):0);
    return '<button class="bcol'+(i===sel?' sel':'')+'" '+(p.v==null?'disabled':'data-a="chartPick" data-i="'+i+'"')+' aria-label="'+mLabel(p.m)+'"><span class="bwrap"><span class="bbar" data-h="'+h+'" style="height:'+(first?0:h)+'%">'+(p.v>0?'<span class="bval">'+shortInr(p.v)+'</span>':'')+'</span></span><span class="blab">'+mShort(p.m)+'</span></button>';
  }).join('');
  return '<div class="ch-head"><div><small>'+(mode==='session'?'Session progress':'Fees collected')+'</small><div class="ch-val">'+(first?cnt(val,true):'<span class="num">'+inr(val)+'</span>')+'</div><small style="display:block">'+mLabel(sp.m)+'</small>'+mom+'</div><span class="pill ac">'+tag+'</span></div>'+
    '<div class="bchart" role="img" aria-label="Fees collected by month"><div class="bplot"><div class="bgrid">'+grid+'</div><div class="bcols">'+cols+'</div></div></div>';
}
function feesSummaryHTML(){
  const by=feesByMonth(),now=curYM(),pm=addMonths(now,-1),cur=by[now]||0,prev=by[pm]||0,m=monthProgress();
  let mom;
  if(prev>0&&cur===prev)mom='<div class="mom flat">'+ic('minus')+'Same as last month</div>';
  else if(prev>0){const pct=Math.round(Math.abs(cur-prev)/prev*100),up=cur>prev;mom='<div class="mom '+(up?'up':'down')+'">'+ic(up?'up2':'down2')+pct+'% '+(up?'more':'less')+' than last month</div>'}

  else mom='<div class="mom flat">'+ic('minus')+'Nothing collected yet this month</div>';

function monthProgress(){
  const now=curYM(),first=now+'-01';let exp=0,col=0;
  state.students.forEach(s=>{
    if(!isActive(s)||s.free)return;
    const rows=schedOf(s);if(!rows.length)return;
    const before=r2(s.transactions.reduce((a,t)=>a+(String(t.date)<first?(+t.amount||0):0),0));
    allocRows(rows,before).forEach(r=>{if(r.month<=now)exp=r2(exp+r.rem)});
    col=r2(col+s.transactions.reduce((a,t)=>a+(String(t.date).slice(0,7)===now?(+t.amount||0):0),0));
  });
  return{expected:exp,collected:col};
}

/* --- installment plan (one-time-fee students) ---
   Everything a student has paid is applied to the installments in date order. A larger payment
   spills into the next installment; a smaller one leaves the installment marked Partial. */
const planOf=s=>Array.isArray(s.plan)?s.plan:[];
const r2=n=>Math.round((+n||0)*100)/100;
function planStatus(s){
  let pool=paidOf(s);
  const rows=planOf(s).slice().sort((a,b)=>String(a.month).localeCompare(String(b.month))).map(p=>{
    const amt=r2(p.amount),got=r2(Math.min(pool,amt));pool=r2(pool-got);
    return{p,amt,got,rem:r2(amt-got),st:got>=amt?'paid':got>0?'partial':'pending'};
  });
  return{rows,extra:pool,planned:r2(rows.reduce((a,x)=>a+x.amt,0))};
}
function planHTML(s){
  const edit='<button class="btn sm" data-a="planEdit" data-id="'+s.id+'">'+ic('edit')+(planOf(s).length?'Edit plan':'Set up')+'</button>';
  if(!planOf(s).length)return '<div class="sect"><h2>Installments</h2>'+edit+'</div><div class="list"><div class="row"><small>No installment plan yet. Split '+inr(feeAmt(s))+' into month-wise amounts and track each one.</small></div></div>';
  const {rows,extra,planned}=planStatus(s),now=curYM(),fee=feeAmt(s);
  const row=x=>{
    const late=x.st!=='paid'&&x.p.month<now;
    const sub=x.st==='paid'?'Collected':x.st==='partial'?'Partial · '+inr(x.got)+' of '+inr(x.amt)+' paid · '+inr(x.rem)+' left':(late?'Overdue':'Pending');
    const cls=x.st==='paid'?'good':(late||x.st==='partial')?(late?'bad':'warn'):'';
    return '<div class="row"><span class="grow"><b>'+mLabel(x.p.month)+'</b><small class="'+cls+'">'+sub+'</small></span><span class="end"><b class="num">'+inr(x.amt)+'</b></span>'+
      (x.st==='paid'?'<span class="act-ic pay">'+ic('check')+'</span>':'<button class="btn sm primary" data-a="planCollect" data-id="'+s.id+'" data-iid="'+x.p.id+'">Collect</button>')+'</div>';
  };
  const note=planned!==r2(fee)?'<small class="warn" style="display:block;margin:.5rem .2rem 0">Plan adds up to '+inr(planned)+' but the total fee is '+inr(fee)+'.</small>':'';
  const ex=extra>0?'<small style="display:block;margin:.5rem .2rem 0">'+inr(extra)+' paid beyond the plan.</small>':'';
  const acts='<div class="btns" style="margin-top:.7rem"><button class="btn" data-a="planRemind" data-id="'+s.id+'">'+ic('chat')+'Remind installment</button><button class="btn" data-a="planShare" data-id="'+s.id+'">'+ic('share')+'Share monthly breakdown</button></div>';
  return '<div class="sect"><h2>Installments</h2>'+edit+'</div><div class="list">'+rows.map(row).join('')+'</div>'+acts+note+ex;
}

/* Auto-split. 'per': fixed amount per month, the remainder goes into the first installment.
   'eq': equal split over N months (remainder also goes to the first). Always splits the full fee,
   because payments are applied to the earliest installments first. */
function splitPlanRows(total,mode,val,start){
  total=r2(total);
  if(!(total>0))return{err:'Set the student’s total fee first'};
  if(!/^\d{4}-\d{2}$/.test(start||''))return{err:'Choose the starting month'};
  let amounts;
  if(mode==='per'){
    const per=r2(val);if(!(per>0))return{err:'Enter the amount per month'};
    const n=Math.floor(total/per+1e-9);
    if(n<1)amounts=[total];
    else{amounts=Array(n).fill(per);amounts[0]=r2(per+r2(total-per*n))}
  }else{
    const n=Math.floor(val);if(!(n>=1))return{err:'Enter the number of months'};
    const each=Math.floor(total/n);if(!(each>0))return{err:'Too many months for this fee'};
    amounts=Array(n).fill(each);amounts[0]=r2(each+r2(total-each*n));
  }
  if(amounts.length>120)return{err:'That makes more than 120 installments'};
  return{rows:amounts.map((a,i)=>({month:addMonths(start,i),amount:a}))};
}
let splitTotal=0;
function splitRead(){
  const mode=$('input[name=sp_mode]:checked').value;
  return splitPlanRows(splitTotal,mode,num($(mode==='per'?'#sp_per':'#sp_n').value),$('#sp_start').value);
}
function splitPreview(){
  const el=$('#sp_prev');if(!el)return;

}

TABS.payments=function(){
  const total=totalReceived(),avg=total/sessionMonthsElapsed();
  const remaining=state.students.filter(isActive).reduce((a,s)=>a+balOf(s),0);
  if(!Q.payFilter)Q.payFilter='all';
  return{
    title:'Payments',
    actions:'<button class="ib" data-a="exportXlsx" aria-label="Export to Excel">'+ic('down')+'</button>',
    html:'<div class="wrap"><div class="stats3" style="margin-bottom:.9rem">'+
      '<div class="stat"><small>Total received</small><b>'+cnt(total,true)+'</b></div>'+
      '<div class="stat"><small>Average / month</small><b>'+cnt(avg,true)+'</b></div>'+
      '<div class="stat"><small>Fees remaining</small><b class="bal '+(remaining?'':'zero')+'">'+cnt(remaining,true)+'</b></div></div>'+
      '<div class="searchbar">'+ic('search')+'<input id="q" type="search" placeholder="Search payments" autocomplete="off" value="'+esc(Q.payments)+'"></div>'+
      '<div class="seg" style="margin:.8rem 0 .2rem">'+[['all','All'],['fees','Fees'],['debits','Debits'],['credits','Credits']].map(t=>'<label><input type="radio" name="pf" value="'+t[0]+'" data-ch="payFilter" '+(Q.payFilter===t[0]?'checked':'')+'><span>'+t[1]+'</span></label>').join('')+'</div>'+
      '<div id="list"></div></div><button class="fab" data-a="payNew">'+ic('plus')+'New entry</button>',
    after(){
      const draw=()=>{
        const q=norm(Q.payments),f=Q.payFilter||'all',items=[];
        if(f==='all'||f==='fees')allTx().forEach(x=>{
          if(!q||[nm(x.owner),x.label,x.t.remark,x.t.mode,String(x.t.amount),fmtDate(x.t.date),x.t.date].some(v=>norm(v).includes(q)))items.push({d:String(x.t.date),x});
        });
        if(f!=='fees')state.ledger.forEach(e=>{
          if(f==='debits'&&e.kind==='receive')return;if(f==='credits'&&e.kind!=='receive')return;
          if(q&&![entryTitle(e),e.remark,entryKind(e),String(e.amount),fmtDate(e.date),e.date].some(v=>norm(v).includes(q)))return;
          items.push({d:String(e.date),e});
        });
        items.sort((a,b)=>b.d.localeCompare(a.d));
        if(!items.length){$('#list').innerHTML='<div class="empty">'+ic('card')+'<b>'+(q?'Nothing matches':'Nothing here yet')+'</b><small>'+(q?'Try a different search.':'Tap New entry to record a fee, a debit or a credit.')+'</small></div>';return}

          if(it.e){h+='<div class="row">'+entryRow(it.e).replace('<button class="row"','<button class="rowmain"')+'</div>';continue}

        }
        $('#list').innerHTML=h+'</div>';
      };
      payDraw=draw;$('#q').oninput=e=>{Q.payments=e.target.value;draw()};draw();
    }
  };
};

async function buildExportSheets(sel,from,to){
  const sheets=[],inR=d=>{d=String(d);return d>=from&&d<=to},fl=x=>x.feeType==='monthly'?'Monthly':'One-time total';
  const stus=state.students.slice().sort(byName),now=curYM();
  if(sel.has('students')){
    const rows=[['Name','Admission no.','Class and subject','Father','Mother','Phone numbers','Fee type','Fee (₹)','Fee category','Date added','Status','Left on','Remarks']];
    stus.forEach(x=>rows.push([x.name,x.admissionNo||'',clsLabel(x),x.father||'',x.mother||'',x.contacts.filter(c=>String(c).trim()).join(', '),fl(x),feeAmt(x),feeTag(x)||'Regular',x.addedDate||'',x.leftDate?'Left':'Active',x.leftDate||'',x.remarks||'']));
    sheets.push({name:'Student details',rows});
  }
  if(sel.has('payments')){
    const l=allTx().filter(x=>inR(x.t.date)).sort((a,b)=>String(a.t.date).localeCompare(String(b.t.date)));
    const rows=[['Date','Student','Class','Amount (₹)','Mode','Remark']];let sum=0;
    l.forEach(x=>{sum+=+x.t.amount||0;rows.push([String(x.t.date),nm(x.owner)+(x.left?' (Left)':''),x.label,+x.t.amount||0,x.t.mode||'',x.t.remark||''])});
    rows.push(['Total','','',Math.round(sum*100)/100,'','']);
    sheets.push({name:'Payments',rows,bold:[rows.length-1]});
  }
  if(sel.has('fees')){
    const rows=[['Student','Class','Fee type','Fee (₹)','Expected till now (₹)','Paid (₹)','Balance (₹)','Status']];
    stus.forEach(x=>rows.push([x.name,clsLabel(x),fl(x),feeAmt(x),expectedOf(x),paidOf(x),balOf(x),(x.free?'Free':feeAmt(x)<=0?'No fee set':balOf(x)>0?'Due':'Paid up')+(x.leftDate?' (Left)':'')]));
    sheets.push({name:'Fee details',rows});
    const ins=[['Student','Class','Month','Amount due (₹)','Collected (₹)','Remaining (₹)','Status']];
    stus.forEach(x=>{if(x.feeType==='monthly')return;planStatus(x).rows.forEach(r=>ins.push([x.name,clsLabel(x),mLabel(r.p.month),r.amt,r.got,r.rem,r.st==='paid'?'Collected':r.st==='partial'?'Partial':(r.p.month<now?'Overdue':'Pending')]))});
    if(ins.length>1)sheets.push({name:'Installments',rows:ins});
  }
  if(sel.has('attendance')){
    const rows=[['Student','Class','Month','Working days','Present','Absent','Attendance %','Absent on (dates)']],m0=from.slice(0,7),m1=to.slice(0,7);
    for(const k of (await store.keys('att:')).sort()){
      const m=k.slice(4,11),c=k.slice(12);if(m<m0||m>m1)continue;
      const rec=await store.getJ(k);if(!rec||typeof rec!=='object')continue;
      if(!Array.isArray(rec.holidays))rec.holidays=[];if(!rec.records)rec.records={};
      state.students.filter(x=>memOf(x,c)&&(x.addedDate||'').slice(0,7)<=m&&(!x.leftDate||x.leftDate.slice(0,7)>=m)).sort(byName).forEach(x=>{
        const st=attStats(rec,m,x);if(!st.total)return;
        rows.push([x.name+(x.leftDate?' (Left)':''),c,mLabel(m),st.total,st.present,st.absent.length,st.pct==null?'':st.pct,st.absent.map(d=>+d.slice(8)).join(', ')]);
      });
    }
    sheets.push({name:'Attendance',rows});
  }
  if(sel.has('tests')){
    const ts=state.tests.filter(t=>inR(t.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||coll.compare(a.name,b.name));
    const rows=[['Date','Test','Class','Subject','Max marks','Student','Marks','Percent','Status']],sum=[['Date','Test','Class','Subject','Max marks','Appeared','Absent','Average marks','Average %']];
    ts.forEach(t=>{
      const l=testRoster(t);
      l.forEach(x=>{const m=t.marks[x.id],has=typeof m==='number';rows.push([t.date,t.name,t.class,t.subject||'',t.maxMarks,x.name+(x.leftDate?' (Left)':''),has?m:'',has&&t.maxMarks>0?Math.round(m/t.maxMarks*1000)/10:'',has?'Appeared':'Absent'])});
      const st=testStats(t);
      sum.push([t.date,t.name,t.class,t.subject||'',t.maxMarks,st?st.n:0,l.length-(st?st.n:0),st?Math.round(st.avg*100)/100:'',st?Math.round(st.pct*10)/10:'']);
    });
    sheets.push({name:'Test history',rows});sheets.push({name:'Test summary',rows:sum});
  }
  if(sel.has('ledger')){
    const l=state.ledger.filter(e=>inR(e.date)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const rows=[['Date','Type','Person','Remarks','Debit (₹)','Credit (₹)']];let dt=0,ct=0;
    l.forEach(e=>{const cr=e.kind==='receive';if(cr)ct+=+e.amount||0;else dt+=+e.amount||0;
      rows.push([String(e.date),e.kind==='expense'?'Expense':cr?'Credit (received)':'Debit (paid)',e.kind==='expense'?'':entryTitle(e),e.remark||'',cr?'':(+e.amount||0),cr?(+e.amount||0):''])});
    rows.push(['Total','','','',r2(dt),r2(ct)]);
    sheets.push({name:'Debits and credits',rows,bold:[rows.length-1]});
    const pr=[['Person','Paid (₹)','Received (₹)','Net paid (₹)']];
    state.people.slice().sort((a,b)=>coll.compare(a.name,b.name)).forEach(p=>{const t=personTotals(p.id,l);pr.push([p.name,t.paid,t.got,t.net])});
    sheets.push({name:'People ledger',rows:pr});
  }
  return sheets;
}
ACT.expRun=async()=>{
  const sel=new Set($$('.exp-cb:checked').map(c=>c.value)),f=$('#x_from').value,t=$('#x_to').value;
  if(!sel.size){toast('Choose at least one thing to export','err');return}
  if(!f||!t||f>t){toast('Choose a valid date range','err');return}

/* --- canvas-drawn receipt / statement image --- */
function receiptCanvas(o){
  const W=1000,M=40,P=52,ff=(FONTS[state.appFont]||FONTS.system).s;
  const ink='#141A26',mut='#5B6578',line='#E3E8F0',acc='hsl('+state.accentHue+' 70% 38%)',accSoft='hsl('+state.accentHue+' 80% 94%)';
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const F=(w,s)=>w+' '+s+'px '+ff;
  const wrap=(t,maxW,f)=>{x.font=f;const words=String(t).split(/\s+/),out=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(x.measureText(test).width>maxW&&cur){out.push(cur);cur=w}else cur=test}if(cur)out.push(cur);return out};
  const rr=(x0,y0,w,h,r)=>{x.beginPath();x.moveTo(x0+r,y0);x.arcTo(x0+w,y0,x0+w,y0+h,r);x.arcTo(x0+w,y0+h,x0,y0+h,r);x.arcTo(x0,y0+h,x0,y0,r);x.arcTo(x0,y0,x0+w,y0,r);x.closePath()};
  function layout(draw,H){
    const L=M+P,R=W-M-P,IW=R-L;let y=M;
    const T=(t,px,py,f,col,al)=>{if(!draw)return;x.font=f;x.fillStyle=col;x.textAlign=al||'left';x.fillText(t,px,py)};
    const HR=yy=>{if(!draw)return;x.fillStyle=line;x.fillRect(L,yy,IW,2)};
    if(draw){
      x.fillStyle='#EDF0F6';x.fillRect(0,0,W,H);
      x.save();x.shadowColor='rgba(20,26,38,.12)';x.shadowBlur=30;x.shadowOffsetY=10;rr(M,M,W-2*M,H-2*M,30);x.fillStyle='#fff';x.fill();x.restore();
      x.save();rr(M,M,W-2*M,H-2*M,30);x.clip();x.fillStyle='#10141C';x.fillRect(M,M,W-2*M,170);x.fillStyle=acc;x.fillRect(M,M+170,W-2*M,6);x.restore();
    }
    T(state.brand||'Tuition',L,M+82,F(800,46),'#FFFFFF');
    T(o.kind==='single'?'Payment receipt':o.kind==='plan'?'Monthly fee breakdown':'Fee statement',L,M+128,F(500,26),'hsl('+state.accentHue+' 88% 74%)');
    y=M+176+56;
    T(o.name,L,y,F(700,38),ink);y+=40;
    T((o.adm?'Adm. No. '+o.adm+'   ':'')+o.cls,L,y,F(400,25),mut);
    T(fmtDate(today()),R,y-40,F(500,24),mut,'right');
    y+=36;HR(y);y+=48;
    if(o.kind==='single'){
      const r=o.rows[0];
      [['Date',fmtDate(r.date)],['Payment mode',r.mode||'—']].concat(r.remark?[['Remark',r.remark]]:[]).forEach(kv=>{
        T(kv[0],L,y,F(400,26),mut);
        const lines=wrap(kv[1],IW-240,F(600,26));lines.forEach((ln,i)=>T(ln,R,y+i*34,F(600,26),ink,'right'));
        y+=Math.max(1,lines.length)*34+14;
      });
      y+=8;
      if(draw){rr(L,y,IW,150,22);x.fillStyle=accSoft;x.fill()}
      T('Amount received',L+34,y+52,F(500,26),mut);
      T(inr(r.amount),L+34,y+118,F(800,64),acc);
      y+=150+40;
    }else if(o.kind==='plan'){
      const cD=L+500,cP=L+660;let sum=0;
      T('Month',L,y,F(600,22),mut);T('Due',cD,y,F(600,22),mut,'right');T('Paid',cP,y,F(600,22),mut,'right');T('Status',R,y,F(600,22),mut,'right');y+=18;HR(y);y+=44;
      o.plan.forEach(r=>{
        sum+=r.amt;
        T(mLabel(r.month),L,y,F(500,25),ink);
        T(inr(r.amt),cD,y,F(700,25),ink,'right');
        T(r.got>0?inr(r.got):'—',cP,y,F(500,25),mut,'right');
        T(r.st,R,y,F(700,24),r.st==='Paid'?'#12805F':r.st==='Overdue'?'#C62828':r.st==='Partial'?'#B7791F':mut,'right');
        y+=50;
      });
      HR(y-14);y+=34;
      T('Total planned',L,y,F(700,28),ink);T(inr(sum),R,y,F(800,32),acc,'right');y+=52;
    }else{
      T('Date',L,y,F(600,22),mut);T('Mode / remark',L+190,y,F(600,22),mut);T('Amount',R,y,F(600,22),mut,'right');y+=18;HR(y);y+=44;
      let sum=0;
      o.rows.forEach(r=>{
        sum+=+r.amount||0;
        T(fmtDate(r.date),L,y,F(500,25),ink);
        const d=[r.mode,r.remark].filter(Boolean).join(' · ')||'—';
        const ln=wrap(d,IW-190-230,F(400,24));
        ln.forEach((l2,i)=>T(l2,L+190,y+i*32,F(400,24),mut));
        T(inr(r.amount),R,y,F(700,26),ink,'right');
        y+=Math.max(1,ln.length)*32+18;
      });
      HR(y-6);y+=34;
      T('Total paid',L,y,F(700,28),ink);T(inr(sum),R,y,F(800,32),acc,'right');y+=52;
    }
    if(o.fee){
      const bw=(IW-2*16)/3,cols=[[o.fee.label,inr(o.fee.total),ink],['Paid',inr(o.fee.paid),ink],['Balance',inr(o.fee.bal),o.fee.bal>0?'#C62828':'#12805F']];
      cols.forEach((c,i)=>{const bx=L+i*(bw+16);if(draw){rr(bx,y,bw,112,18);x.fillStyle='#F4F6FA';x.fill()}T(c[0],bx+22,y+40,F(500,22),mut);T(c[1],bx+22,y+86,F(800,30),c[2])});
      y+=112+44;
    }
    HR(y);y+=44;
    T('Thank you',L,y,F(700,26),ink);y+=38;
    const who=[state.teacher,state.teacherWhatsapp&&'WhatsApp '+state.teacherWhatsapp,state.teacherEmail,state.teacherInstagram&&'Instagram '+state.teacherInstagram,state.teacherYoutube&&'YouTube '+state.teacherYoutube].filter(Boolean);
    who.forEach(w=>{T(w,L,y,F(400,23),mut);y+=33});
    if(state.teacherAddress)wrap(state.teacherAddress,IW,F(400,23)).forEach(ln=>{T(ln,L,y,F(400,23),mut);y+=33});
    return y+M+P/2;
  }
  const H=Math.ceil(layout(false));cv.width=W;cv.height=H;layout(true,H);
  return cv;
}

async function pickQR(){

  const opts=[];
  if(state.qrCodeDataUrl)opts.push({v:'saved',label:'Include my saved QR code',icon:'check'});

  opts.push({v:'none',label:'Text only, no QR',icon:'chat'});
  const c=await chooseSheet('Include a payment QR?',opts);

  if(c==='saved')return state.qrCodeDataUrl;

async function remindFlow(sid){
  const s=byId(sid);if(!s)return;
  const dflt=balOf(s)||feeAmt(s);
  const v=await promptSheet({title:'Send fee reminder',body:'Message goes to the parent of '+s.name+'.',label:'Amount to request (₹)',type:'number',value:dflt?String(dflt):'',ok:'Continue'});
  if(v===null)return;
  const amt=num(v);if(!(amt>0)){toast('Enter an amount greater than 0','err');return}
  const qr=await pickQR();if(qr===undefined)return;
  let msg='Dear Parent, fee update for '+s.name+' ('+clsLabel(s)+'):\n'+(s.feeType==='monthly'?'Monthly fee':'Total fee')+': '+inr(feeAmt(s))+'\nPaid till date: '+inr(paidOf(s))+'\nAmount requested ('+MONTHS[new Date().getMonth()]+'): '+inr(amt)+'\nKindly pay at the earliest convenience.';
  if(state.upiId)msg+='\nUPI ID: '+state.upiId;
  if(qr)msg+='\n(QR code attached)';
  msg+='\n\n'+[state.teacher,state.brand].filter(Boolean).join(', ');
  await deliverWA(s,msg,qr);
}
async function deliverWA(s,text,qr){
  const nums=(s.contacts||[]).map(c=>String(c).trim()).filter(Boolean);
  let num1=null;
  if(nums.length===1)num1=nums[0];
  else if(nums.length>1){num1=await chooseSheet('Send to which number?',nums.map(n=>({v:n,label:n,icon:'phone'})));if(!num1)return}
  if(qr){
    try{
      const blob=await(await fetch(qr)).blob();
      const f=new File([blob],'payment-qr.png',{type:blob.type||'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f],text})){await navigator.share({files:[f],text});return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  if(num1){window.open('https://wa.me/'+waNumber(num1)+'?text='+encodeURIComponent(text),'_blank');return}
  if(navigator.share){try{await navigator.share({text})}catch(e){}return}
  await copyText(text);toast('No phone number on file. Message copied, paste it in any app.');
}

function readMarks(max,scope){
  const marks={},absent={};let bad=null;
  $$('.mk',scope).forEach(i=>{
    const sid=i.dataset.sid,v=i.value.trim();
    if(v===''){absent[sid]=true;return}
    const n=parseFloat(v);
    if(isNaN(n)||n<0||n>max){if(!bad)bad=i;return}
    marks[sid]=n;
  });
  if(bad){bad.focus();toast('Marks must be between 0 and '+fmtN(max),'err');return null}
  return{marks,absent};
}
ACT.saveTest=el=>{
  const id=el.dataset.id,name=$('#t_name').value.trim(),cls=$('#t_cls').value,date=$('#t_date').value,max=num($('#t_max').value);

  if(!cls){toast('Choose a class','err');return}
  if(!date){toast('Choose the test date','err');return}
  if(!(max>0)){toast('Maximum marks must be greater than 0','err');$('#t_max').focus();return}
  const subject=$('#t_sub').value.trim();
  if(id){
    const t=state.tests.find(x=>x.id===id);if(!t)return;
    if(Object.values(t.marks).some(v=>v>max)){toast('Some saved marks are higher than '+fmtN(max),'err');return}
    Object.assign(t,{name,subject,class:cls,date,maxMarks:max});save();toast('Test updated');back();return;
  }
  const r=readMarks(max,$('#roster'));if(!r)return;
  state.tests.push({id:uid(),name,subject,class:cls,date,maxMarks:max,marks:r.marks,absent:r.absent});
  save();toast('Test saved');back();
};

    (l.length?'<div class="list">'+l.map(t=>{const m=t.marks[s.id],has=typeof m==='number';return '<button class="row" data-a="testOpen" data-id="'+t.id+'"><span class="grow"><b>'+esc(t.name)+'</b><small>'+esc(t.class)+(t.subject?' · '+esc(t.subject):'')+' · '+fmtDate(t.date)+'</small></span><span class="end">'+(has?'<b class="num">'+fmtN(m)+'/'+fmtN(t.maxMarks)+'</b><small class="'+pctClass(m/t.maxMarks*100)+'">'+Math.round(m/t.maxMarks*100)+'%</small>':'<span class="pill">Absent</span>')+'</span></button>'}).join('')+'</div>':'<div class="empty">'+ic('file')+'<b>No tests yet</b></div>')+'</div>'};

   ===================================================================== */
let AT=null,attTok=0;
function attStats(rec,month,s){
  const dim=daysInMonth(month),t=today(),work=[];let hol=0;
  for(let d=1;d<=dim;d++){const dt=month+'-'+pad(d);if(dt>t)break;if(rec.holidays.includes(dt))hol++;else work.push(dt)}
  const mine=s?work.filter(d=>d>=(s.addedDate||'')):work;
  const ab=s?mine.filter(d=>rec.records[d]&&rec.records[d][s.id]==='absent'):[];
  return{work,hol,total:mine.length,absent:ab,present:mine.length-ab.length,pct:mine.length?Math.round((mine.length-ab.length)/mine.length*100):null};
}
PAGES.attendance=function(a){

  const date0=(a&&a.date)||today();
  return{title:'Attendance',html:'<div class="wrap narrow"><div class="two stack"><label class="f">Class<select class="inp" id="at_cls" data-ch="attSel">'+classOptions(cls0)+'</select></label><label class="f">Date<input class="inp" type="date" id="at_date" data-ch="attSel" max="'+today()+'" value="'+date0+'"></label></div><div id="attBody" style="margin-top:1rem"></div></div>',
    after(){attLoad(cls0,date0)}};
};

async function attLoad(cls,date){
  const tok=++attTok,month=date.slice(0,7);
  const rec=clone(await getAtt(cls,month));
  if(tok!==attTok)return;
  AT={cls,date,month,rec,absent:new Set(Object.keys(rec.records[date]||{}))};
  drawAtt();
}
function attCounts(){
  const n=rosterOf(AT.cls).length,a=[...AT.absent].filter(id=>byId(id)).length;
  return (n-a)+' present, '+a+' absent';
}
function drawAtt(){
  const box=$('#attBody');if(!box||!AT)return;
  const {cls,date,month,rec}=AT,hol=rec.holidays.includes(date),saved=!!rec.records[date];
  const roster=rosterOf(cls);
  const summaryBtn='<button class="btn ghost big" style="margin-top:.8rem" data-a="attSummaryGo">'+ic('bars')+'Monthly summary for '+esc(mLabel(month))+'</button>';
  if(hol){
    box.innerHTML='<div class="notice">'+ic('info')+'<div><b>Tuition off on '+fmtDate(date)+'</b><br><small>This day does not count as a working day for '+esc(cls)+'.</small></div></div><div class="btns" style="margin-top:.9rem"><button class="btn primary" data-a="attResume">Resume tuition</button><button class="btn danger" data-a="attRedo">Redo day</button></div>'+summaryBtn;
    return;
  }
  box.innerHTML=(roster.length?'<div class="sect" style="margin-top:0"><h2>'+esc(cls)+', '+esc(friendlyDay(date))+'</h2><span class="pill" id="attCount">'+attCounts()+'</span></div><div class="list">'+roster.map(s=>'<div class="attrow">'+avatar(s.name,stuColor(s),'sm')+'<span class="grow"><b>'+esc(s.name)+'</b></span><button class="tog '+(AT.absent.has(s.id)?'on':'')+'" data-a="attToggle" data-id="'+s.id+'">'+(AT.absent.has(s.id)?'Absent':'Mark absent')+'</button>'+(rec.records[date]&&rec.records[date][s.id]?'<button class="ib" data-a="attMsg" data-id="'+s.id+'" aria-label="Message parent">'+ic('chat')+'</button>':'')+'</div>').join('')+'</div>':'<div class="empty">'+ic('users')+'<b>No active students in '+esc(cls)+'</b><small>Everyone is present by default. Only absences are recorded.</small></div>')+
    '<div class="savebar"><button class="btn primary big" data-a="attSave">Save attendance</button></div>'+
    '<div class="btns"><button class="btn" data-a="attOff">Tuition off</button>'+((saved||AT.absent.size)?'<button class="btn danger" data-a="attRedo">Redo day</button>':'')+'</div>'+summaryBtn;

ACT.attToggle=el=>{

async function buildBackup(){
  const att={};for(const k of await store.keys('att:')){const r=await store.getJ(k);if(r)att[k]=r}
  return{format:'tuition-manager-backup',version:1,exportedAt:new Date().toISOString(),state,attendance:att};
}
async function applyRestore(text,skipSafety){
  let d;try{d=JSON.parse(text)}catch(e){toast('That file is not a valid backup','err');return false}
  if(!d||d.format!=='tuition-manager-backup'||!d.state||typeof d.state!=='object'){toast('That file is not a Tuition Manager backup','err');return false}
  const empty=!state.setupDone||(!state.students.length&&!state.tests.length&&!state.classes.length);
  if(!empty&&!skipSafety&&!await confirmDlg('Replace all data?','Restoring completely replaces everything on this device with the backup'+(d.exportedAt?' from '+esc(fmtDate(String(d.exportedAt).slice(0,10))):'')+'. Anything not in the backup is lost.','Replace everything'))return false;
  if(!skipSafety&&!empty){try{localStorage.setItem('tm-prerestore',JSON.stringify(await buildBackup()))}catch(e){}}
  for(const k of await store.keys('att:'))await store.del(k);
  attCache.clear();
  for(const k of Object.keys(d.attendance||{}))if(k.startsWith('att:'))await store.setJ(k,d.attendance[k]);
  state=normalizeState(d.state);state.loggedOut=false;
  await flush();applyTheme();stack=[];tab='home';chartSel=null;
  toast('Backup restored');renderRoot();return true;
}
const driveOn=()=>!!GOOGLE_CLIENT_ID&&(location.protocol==='https:'||location.hostname==='localhost');
let gTok=null,gExp=0;
function loadGIS(){
  return new Promise((ok,no)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
    const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>ok();s.onerror=()=>no(new Error('Could not reach Google. Check your connection.'));document.head.append(s);
  });
}
async function driveAuth(interactive){
  if(gTok&&Date.now()<gExp)return gTok;
  await loadGIS();
  return new Promise((ok,no)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return no(new Error('Google sign-in failed'));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;localStorage.setItem('tm-drive','1');ok(gTok)},
      error_callback:()=>no(new Error('Google sign-in was cancelled'))});
    tc.requestAccessToken({prompt:interactive?'consent':''});
  });
}
async function driveFind(tok){
  const q=encodeURIComponent("name='"+DRIVE_FILE+"' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name,modifiedTime)',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
  const j=await r.json();return j.files&&j.files[0]||null;
}
ACT.driveConnect=async()=>{try{await driveAuth(true);toast('Google Drive connected');render(true)}catch(e){toast(e.message,'err')}};
ACT.driveDisconnect=async()=>{
  try{if(gTok&&window.google)google.accounts.oauth2.revoke(gTok)}catch(e){}
  gTok=null;localStorage.removeItem('tm-drive');toast('Google Drive disconnected');render(true);
};
ACT.driveBackup=async()=>{
  try{
    const tok=await driveAuth(false);
    state.lastBackupAt=new Date().toISOString();state.lastDriveSync=state.lastBackupAt;await flush();
    const body=JSON.stringify(await buildBackup()),f=await driveFind(tok);
    let r;
    if(f)r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body});
    else{
      const b='tmboundary'+Date.now();
      r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},
        body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:DRIVE_FILE,mimeType:'application/json'})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'});
    }
    if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
    toast('Backed up to Google Drive');render(true);
  }catch(e){toast(e.message||'Drive backup failed','err')}
};
ACT.driveRestore=async()=>{
  try{
    const tok=await driveAuth(false),f=await driveFind(tok);
    if(!f){toast('No backup found in your Google Drive','err');return}
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw new Error('Google Drive returned an error ('+r.status+')');
    await applyRestore(await r.text());
  }catch(e){toast(e.message||'Drive restore failed','err')}
};

ACT.doBackup=async()=>{
  const c=await chooseSheet('Back up your data',[
    {v:'save',label:'Save to this phone',sub:'Download the backup file to storage',icon:'down'},
    {v:'share',label:'Share it',sub:'WhatsApp, Drive, email or any other app',icon:'share'}]);
  if(!c)return;
  const prev=state.lastBackupAt;
  state.lastBackupAt=new Date().toISOString();await flush();
  const name='tuition-manager-backup-'+today()+'.json',blob=new Blob([JSON.stringify(await buildBackup())],{type:'application/json'});
  let done=false;
  if(c==='share'){
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name,text:(state.brand||'Tuition Manager')+' backup'});done=true;toast('Backup shared')}
      catch(e){if(!(e&&e.name==='AbortError')){download(blob,name);done=true;toast('Sharing failed, so the file was saved to your phone instead','err')}}
    }else{download(blob,name);done=true;toast('Sharing is not available here, so the file was saved to your phone')}
  }else{download(blob,name);done=true;toast('Backup saved to your phone')}
  if(!done){state.lastBackupAt=prev;await flush()}
  render(true);
};

/* =====================================================================
   LEDGER
   Debit  = money going out: an expense, or a payment to a person
   Credit = money coming in from a person
   Every person has their own ledger. Expenses have no person and can only be debits.
   ===================================================================== */
const personById=id=>state.people.find(p=>p.id===id);
const entryTitle=e=>e.kind==='expense'?'Expense':(personById(e.personId)||{name:'Unknown person'}).name;
const entryKind=e=>e.kind==='expense'?'Expense':e.kind==='pay'?'Paid':'Received';
function personTotals(id,list){
  let paid=0,got=0;(list||state.ledger).forEach(e=>{if(e.personId!==id)return;if(e.kind==='pay')paid+=+e.amount||0;else if(e.kind==='receive')got+=+e.amount||0});
  return{paid:r2(paid),got:r2(got),net:r2(paid-got)};
}
const netText=n=>n===0?'Settled':(n>0?inr(n)+' paid':inr(-n)+' received');
const receivedIn=ym=>r2(allTx().filter(x=>String(x.t.date).slice(0,7)===ym).reduce((a,x)=>a+(+x.t.amount||0),0));
function monthFlow(ym){
  const inM=e=>String(e.date).slice(0,7)===ym;
  const credits=state.ledger.filter(e=>e.kind==='receive'&&inM(e)).reduce((a,e)=>a+(+e.amount||0),0);
  const out=state.ledger.filter(e=>e.kind!=='receive'&&inM(e)).reduce((a,e)=>a+(+e.amount||0),0);
  const inn=r2(receivedIn(ym)+credits);return{inn,out:r2(out),net:r2(inn-out)};
}
function addPerson(name){
  const ex=state.people.find(p=>p.name.toLowerCase()===name.toLowerCase());if(ex)return ex.id;
  const p={id:uid(),name};state.people.push(p);save();return p.id;
}
const entryRow=(e,title)=>'<button class="row" data-a="entryOpen" data-id="'+e.id+'"><span class="act-ic '+(e.kind==='receive'?'pay':'left')+'">'+ic(e.kind==='receive'?'up2':'down2')+'</span><span class="grow"><b>'+esc(title||e.remark||entryTitle(e))+'</b><small>'+fmtDate(e.date)+' · '+entryKind(e)+(title&&e.remark?' · '+esc(e.remark):'')+'</small></span><span class="end"><b class="num '+(e.kind==='receive'?'good':'')+'">'+(e.kind==='receive'?'+':'−')+inr(e.amount)+'</b></span></button>';
const byDateDesc=(a,b)=>String(b.date).localeCompare(String(a.date));

PAGES.ledger=function(){
  const now=curYM(),f=monthFlow(now);
  const ppl=state.people.map(p=>({p,t:personTotals(p.id),last:state.ledger.filter(e=>e.personId===p.id).sort(byDateDesc).map(e=>e.date)[0]||''})).sort((a,b)=>String(b.last).localeCompare(String(a.last))||coll.compare(a.p.name,b.p.name));
  const exp=state.ledger.filter(e=>e.kind==='expense').sort(byDateDesc);
  return{title:'Ledger',html:'<div class="wrap narrow"><small style="display:block;margin:0 .2rem .5rem">'+mLabel(now)+'</small><div class="stats3"><div class="stat"><small>Money in</small><b>'+inr(f.inn)+'</b></div><div class="stat"><small>Money out</small><b class="'+(f.out?'bal':'')+'">'+inr(f.out)+'</b></div><div class="stat"><small>Net</small><b class="'+(f.net<0?'bal':'')+'">'+inr(f.net)+'</b></div></div>'+
    '<div class="sect"><h2>People</h2><button class="btn sm" data-a="personAdd">'+ic('plus')+'Add person</button></div>'+
    (ppl.length?'<div class="list">'+ppl.map(x=>'<button class="row" data-a="personOpen" data-id="'+x.p.id+'">'+avatar(x.p.name,'')+'<span class="grow"><b>'+esc(x.p.name)+'</b><small>Paid '+inr(x.t.paid)+' · Received '+inr(x.t.got)+'</small></span><span class="end"><b class="num">'+netText(x.t.net)+'</b></span></button>').join('')+'</div>':'<div class="list"><div class="row"><small>No people yet. Add someone you pay or receive money from.</small></div></div>')+
    '<div class="sect"><h2>Expenses</h2></div>'+(exp.length?'<div class="list">'+exp.map(e=>entryRow(e)).join('')+'</div>':'<div class="list"><div class="row"><small>No expenses yet.</small></div></div>')+
    '</div><button class="fab" data-a="ledgerNew">'+ic('plus')+'New entry</button>'};
};
PAGES.person=function({id}){
  const p=personById(id);
  if(!p)return{title:'Person',html:'<div class="wrap"><div class="empty"><b>Person not found</b></div></div>'};
  const t=personTotals(id),l=state.ledger.filter(e=>e.personId===id).sort(byDateDesc);
  return{title:p.name,html:'<div class="wrap narrow"><div class="stats3"><div class="stat"><small>Paid</small><b>'+inr(t.paid)+'</b></div><div class="stat"><small>Received</small><b class="good">'+inr(t.got)+'</b></div><div class="stat"><small>'+(t.net<0?'Net received':'Net paid')+'</small><b>'+inr(Math.abs(t.net))+'</b></div></div>'+
    '<div class="btns" style="margin:1rem 0"><button class="btn primary" data-a="entryNew" data-kind="pay" data-p="'+id+'">'+ic('down2')+'I paid</button><button class="btn" data-a="entryNew" data-kind="receive" data-p="'+id+'">'+ic('up2')+'I received</button></div>'+
    '<div class="sect"><h2>Ledger</h2></div>'+(l.length?'<div class="list">'+l.map(e=>entryRow(e,e.remark||entryKind(e))).join('')+'</div>':'<div class="empty">'+ic('card')+'<b>No entries yet</b><small>Use I paid or I received to start this ledger.</small></div>')+
    '<div class="btns" style="margin-top:1.6rem"><button class="btn sm" data-a="personRename" data-id="'+id+'">'+ic('edit')+'Rename</button><button class="btn sm danger" data-a="personDelete" data-id="'+id+'">'+ic('trash')+'Delete person</button></div></div>'};
};
PAGES.entryForm=function({id,kind,personId}){
  const e=id?state.ledger.find(x=>x.id===id):null;
  if(id&&!e)return{title:'Entry',html:'<div class="wrap"><div class="empty"><b>Entry not found</b></div></div>'};
  const k=e?e.kind:kind,pid=e?e.personId:(personId||''),p=pid?personById(pid):null;
  if(k!=='expense'&&!p)return{title:'Entry',html:'<div class="wrap"><div class="empty"><b>Person not found</b></div></div>'};
  const head=k==='expense'?'Expense':k==='pay'?'Paying '+p.name:'Receiving from '+p.name;
  const v=e||{amount:'',remark:'',date:today()};
  return{title:e?'Edit entry':(k==='expense'?'Add expense':k==='pay'?'Add debit':'Add credit'),html:'<div class="wrap narrow"><div class="form">'+
    '<div class="card" style="display:flex;align-items:center;gap:.8rem"><span class="act-ic '+(k==='receive'?'pay':'left')+'">'+ic(k==='receive'?'up2':'down2')+'</span><span class="grow"><b>'+esc(head)+'</b><small style="display:block">'+(k==='receive'?'Credit, money in':'Debit, money out')+'</small></span></div>'+
    '<label class="f">Amount (₹)<input class="inp" id="d_amt" type="number" inputmode="decimal" min="0" step="any" value="'+esc(v.amount)+'" placeholder="0"></label>'+
    '<label class="f">Remarks<input class="inp" id="d_rem" value="'+esc(v.remark)+'" placeholder="Optional" autocomplete="off"></label>'+
    '<label class="f">Date<input class="inp" id="d_date" type="date" value="'+esc(v.date)+'"></label>'+
    '<div class="savebar"><button class="btn primary big" data-a="saveEntry" data-id="'+(e?e.id:'')+'" data-kind="'+k+'" data-p="'+esc(pid)+'">Save</button>'+(e?'<button class="btn danger" data-a="delEntry" data-id="'+e.id+'">'+ic('trash')+'Delete</button>':'')+'</div></div></div>'};
};
ACT.saveEntry=el=>{
  const amount=r2(num($('#d_amt').value)),date=$('#d_date').value,remark=$('#d_rem').value.trim(),id=el.dataset.id;
  if(!(amount>0)){toast('Enter an amount greater than 0','err');$('#d_amt').focus();return}
  if(!date){toast('Choose the date','err');return}
  if(id){const e=state.ledger.find(x=>x.id===id);if(!e)return;Object.assign(e,{amount,remark,date})}
  else{const kind=el.dataset.kind;state.ledger.push({id:uid(),date,amount,kind,personId:kind==='expense'?'':el.dataset.p,remark})}
  save();toast(id?'Entry updated':'Entry saved');back();
};
ACT.delEntry=async el=>{
  if(!await confirmDlg('Delete this entry?','It is removed from the ledger.','Delete'))return;
  state.ledger=state.ledger.filter(x=>x.id!==el.dataset.id);save();toast('Entry deleted');back();
};
ACT.entryOpen=el=>go('entryForm',{id:el.dataset.id});
ACT.entryNew=el=>go('entryForm',{kind:el.dataset.kind,personId:el.dataset.p});
ACT.personOpen=el=>go('person',{id:el.dataset.id});
ACT.personAdd=async()=>{
  const n=await promptSheet({title:'New person',body:'Their name stays in your ledger so you can see everything with them.',label:'Name',placeholder:'For example, Ramesh'});
  if(!n)return;const had=state.people.length;addPerson(n);toast(state.people.length>had?'Person added':'That person is already in your ledger');render(true);
};
ACT.personRename=async el=>{
  const p=personById(el.dataset.id);if(!p)return;
  const n=await promptSheet({title:'Rename',label:'Name',value:p.name});if(!n)return;
  p.name=n;save();toast('Renamed');render(true);
};
ACT.personDelete=async el=>{
  const p=personById(el.dataset.id);if(!p)return;const n=state.ledger.filter(e=>e.personId===p.id).length;
  if(!await confirmDlg('Delete '+esc(p.name)+'?',n?'This also deletes their '+n+' ledger entr'+(n>1?'ies':'y')+'.':'They have no entries.','Delete person'))return;
  state.ledger=state.ledger.filter(e=>e.personId!==p.id);state.people=state.people.filter(x=>x.id!==p.id);save();toast('Person deleted');back();
};
/* choose a person (or add one by name), then open the entry form */
async function pickPerson(kind){
  let pid=null;
  if(state.people.length){
    const c=await chooseSheet(kind==='pay'?'Pay whom?':'Received from whom?',state.people.slice().sort((a,b)=>coll.compare(a.name,b.name)).map(p=>({v:p.id,label:p.name,sub:netText(personTotals(p.id).net),icon:'user'})).concat([{v:'__new',label:'Add a new person',icon:'plus'}]));
    if(!c)return;if(c!=='__new')pid=c;
  }
  if(!pid){
    const n=await promptSheet({title:'New person',body:'Their name stays in your ledger so you can see everything with them.',label:'Name',placeholder:'For example, Ramesh'});
    if(!n)return;pid=addPerson(n);
  }
  go('entryForm',{kind,personId:pid});
}
async function debitFlow(){
  const c=await chooseSheet('Debit',[{v:'expense',label:'Expense',sub:'Rent, bills, materials and similar',icon:'card'},{v:'pay',label:'Pay someone',sub:'Staff or anyone else, kept in their ledger',icon:'user'}],'Money going out');
  if(c==='expense')go('entryForm',{kind:'expense'});else if(c==='pay')await pickPerson('pay');
}
ACT.qaDebit=debitFlow;
/* the "New entry" button on the Payments tab, and the one on the Ledger screen */
ACT.payNew=async()=>{
  const c=await chooseSheet('What are you recording?',[
    {v:'fee',label:'Fee payment',sub:'Money received from a student',icon:'users'},
    {v:'debit',label:'Debit',sub:'An expense, or a payment to someone',icon:'down2'},
    {v:'credit',label:'Credit',sub:'Money received from a person',icon:'up2'}]);
  if(c==='fee')go('payPick');else if(c==='debit')await debitFlow();else if(c==='credit')await pickPerson('receive');
};
ACT.ledgerNew=async()=>{
  const c=await chooseSheet('New entry',[
    {v:'debit',label:'Debit',sub:'An expense, or a payment to someone',icon:'down2'},
    {v:'credit',label:'Credit',sub:'Money received from a person',icon:'up2'}]);
  if(c==='debit')await debitFlow();else if(c==='credit')await pickPerson('receive');
};
