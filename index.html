/* Total collected (all students, not just active) per calendar month,
   for the last n months including the current one — oldest first. */
function monthlyCollectedSeries(n){
  const now=new Date();
  const months=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  const totals=Object.fromEntries(months.map(m=>[m,0]));
  state.students.forEach(s=>(s.transactions||[]).forEach(t=>{
    const mk=monthKeyOf(t.date);
    if(mk in totals)totals[mk]+=Math.round(Number(t.amount)||0);
  }));
  return months.map(m=>({month:m,label:monthLabel(m).split(" ")[0].slice(0,3),total:totals[m],future:false}));
}
/* Full month-by-month series spanning the WHOLE academic session
   (sessionStart → sessionEnd), used to merge "Fees Collected" and
   "Session Progress" into one chart. Months after the current
   month are marked future:true so the chart knows to leave them
   blank instead of drawing a false zero. Returns null when the
   person hasn't set session dates yet, so the caller can fall
   back to the plain last-6-months view. */
function sessionMonthsSeries(){
  const startKey=state.sessionStart,endKey=state.sessionEnd;
  if(!startKey||!endKey)return null;
  const [sy,sm]=startKey.split("-").map(Number);
  const [ey,em]=endKey.split("-").map(Number);
  if(!sy||!sm||!ey||!em)return null;
  const months=[];
  let y=sy,m=sm,guard=0;
  while((y<ey||(y===ey&&m<=em))&&guard++<240){
    months.push(`${y}-${String(m).padStart(2,"0")}`);
    m++;if(m>12){m=1;y++;}
  }
  if(!months.length)return null;
  const totals=Object.fromEntries(months.map(mk=>[mk,0]));
  state.students.forEach(s=>(s.transactions||[]).forEach(t=>{
    const mk=monthKeyOf(t.date);
    if(mk in totals)totals[mk]+=Math.round(Number(t.amount)||0);
  }));
  const nowKey=currentMonthKey();
  return months.map(mk=>({month:mk,label:monthLabel(mk).split(" ")[0].slice(0,3),total:totals[mk],future:mk>nowKey}));
}
/* Inline SVG line chart for the merged "Session Progress / Fees
   Collected" card — self-contained, offline-friendly, no chart
   library. Has a labelled y-axis (gridlines + amount ticks) and is
   tappable: each elapsed month is a real tap target that updates
   the headline figure above the chart, so the interaction stays
   instant. `revealFrac` (0–1) is how much of the session has
   elapsed: months after that point are simply never drawn, so the
   line/area stop exactly there and the rest of the axis stays
   empty — and it doubles as the on-load "draw-in" animation target
   (see initChartReveal), which wipes the chart from 0 up to this
   same point every time the home screen opens. */
function niceAxisMax(max){
  if(max<=0)return 100;
  const mag=Math.pow(10,Math.floor(Math.log10(max)));
  const norm=max/mag;
  const step=norm<=1?1:norm<=2?2:norm<=5?5:10;
  return step*mag;
}
function sessionFeeChartSVG(series,revealFrac,selIdx,{w=280,h=150}={}){
  const elapsed=series.filter(p=>!p.future);
  const vals=elapsed.map(p=>p.total);
  const axisMax=niceAxisMax(Math.max(1,...vals,0));
  const yTicks=4;
  const padL=40,padR=10,padT=10,padB=22;
  const cw=w-padL-padR,ch=h-padT-padB;
  const n=series.length;
  const step=n>1?cw/(n-1):0;
  const xOf=i=>padL+i*step;
  const yOf=v=>padT+ch-(v/axisMax)*ch;
  const elapsedPts=series.map((p,i)=>({p,i})).filter(o=>!o.p.future)
    .map(o=>({x:xOf(o.i),y:yOf(o.p.total),p:o.p,i:o.i}));
  const line=elapsedPts.length?elapsedPts.map((pt,idx)=>`${idx===0?"M":"L"}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(" "):"";
  const area=elapsedPts.length?`${line} L${elapsedPts[elapsedPts.length-1].x.toFixed(1)},${(padT+ch).toFixed(1)} L${elapsedPts[0].x.toFixed(1)},${(padT+ch).toFixed(1)} Z`:"";
  const gridRows=Array.from({length:yTicks+1},(_,i)=>{
    const v=axisMax*(1-i/yTicks);
    const y=yOf(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--muted)">${moneyCompact(v)}</text>`;
  }).join("");
  /* Thin out x-axis labels once the session has too many months for
     them to fit legibly — always keep the first, last and selected
     month so the range and the current point are never hidden. */
  const labelEvery=n>9?Math.ceil(n/7):1;
  const xLabels=series.map((p,i)=>{
    if(i!==0&&i!==n-1&&i!==selIdx&&i%labelEvery!==0)return "";
    return `<text x="${xOf(i).toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" fill="${i===selIdx?"var(--accent)":"var(--muted)"}" font-weight="${i===selIdx?500:400}">${esc(p.label)}</text>`;
  }).join("");
  const dots=elapsedPts.map(pt=>pt.i===selIdx
    ? `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="5" fill="var(--bg)" stroke="var(--good)" stroke-width="2.4"/>`
    : `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="2.6" fill="var(--good)"/>`).join("");
  const selPt=elapsedPts.find(pt=>pt.i===selIdx);
  const selLine=selPt?`<line x1="${selPt.x.toFixed(1)}" y1="${padT}" x2="${selPt.x.toFixed(1)}" y2="${padT+ch}" stroke="var(--good)" stroke-width="1" stroke-dasharray="2,3" opacity=".55"/>`:"";
  const hitW=n>1?step:w-padL-padR;
  const hitTargets=elapsedPts.map(pt=>`<rect x="${(pt.x-hitW/2).toFixed(1)}" y="${padT}" width="${hitW.toFixed(1)}" height="${ch}" fill="transparent" style="cursor:pointer" onclick="selectFeeChartMonth(${pt.i})"/>`).join("");
  /* Pad the reveal clip a few px past its exact target so the marker
     circle sitting right at the reveal edge (typically the current/
     selected month) doesn't get sliced in half by the clip-path. */
  const revealFracSafe=Number.isFinite(revealFrac)?revealFrac:1;
  const revealW=Math.max(0,Math.min(cw,cw*revealFracSafe+(revealFracSafe<1?8:0)));
  const clipId="feeChartReveal"+Math.random().toString(36).slice(2,9);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">
    <defs>
      <linearGradient id="feeChartFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--good)" stop-opacity=".28"/>
        <stop offset="100%" stop-color="var(--good)" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="${clipId}"><rect class="chart-reveal-rect" data-full-w="${revealW.toFixed(1)}" x="${padL}" y="0" width="${revealW.toFixed(1)}" height="${h}"/></clipPath>
    </defs>
    ${gridRows}
    <g clip-path="url(#${clipId})">
      <path d="${area}" fill="url(#feeChartFill)" stroke="none"/>
      <path d="${line}" fill="none" stroke="var(--good)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${selLine}${dots}
    </g>
    ${xLabels}
    ${hitTargets}
  </svg>`;
}
/* Compact ₹ label for axis ticks: 45000 -> ₹45k, 120000 -> ₹1.2L */
function moneyCompact(v){
  v=Math.round(v);
  if(v>=100000)return "₹"+(v/100000).toFixed(v%100000===0?0:1)+"L";
  if(v>=1000)return "₹"+(v/1000).toFixed(v%1000===0?0:1)+"k";
  return "₹"+v;
}

/* ---------- On-load chart "wipe" animation ----------
   Every .chart-reveal-rect clip-rect carries its real target width
   in data-full-w. On mount we start it at 0 and animate up to that
   width with an ease-in-out tween, so the chart always visibly
   "grows in" toward wherever the session/data actually is — right
   near the end if the session is nearly over, only halfway if it's
   half done, and so on. */
function initChartReveal(container){
  if(!container)return;
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  container.querySelectorAll(".chart-reveal-rect").forEach(rect=>{
    const target=parseFloat(rect.getAttribute("data-full-w"))||0;
    if(reduced){rect.setAttribute("width",target);return;}
    rect.setAttribute("width","0");
    const start=performance.now(),dur=900;
    (function step(now){
      const t=Math.min(1,(now-start)/dur);
      const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      rect.setAttribute("width",(target*e).toFixed(1));
      if(t<1)requestAnimationFrame(step);
      else rect.setAttribute("width",target);
    })(start);
  });
}
function setChartRevealInstant(container){
  if(!container)return;
  container.querySelectorAll(".chart-reveal-rect").forEach(rect=>{
    rect.setAttribute("width",parseFloat(rect.getAttribute("data-full-w"))||0);
  });
}
function thisMonthDueForStudent(s){
  if(!isActive(s))return 0;
  return Math.max(0,expectedThisMonth(s)-paidInMonth(s,currentMonthKey()));
}
/* Flat, dead-simple "what this month costs" — no front-loaded/back-loaded
   schedule. Monthly-fee students: their fixed monthly rate. Total-fee
   students: the total spread evenly across the months of their session. */
function expectedThisMonth(s){
  if(isMonthlyFeeStudent(s))return safeFees(s.monthlyFee);
  return Math.round(safeFees(s.totalFees)/Math.max(1,totalMonthsForStudent(s)));
}
/* Sum of whatever was actually paid with a transaction DATED in that
   calendar month — not a running balance carried forward. This is what
   makes "paid in advance for later months" not count toward THIS month:
   an advance payment is dated in the month it was made, so it settles
   that month only, and the current month still needs its own payment. */
function paidInMonth(s,monthKey){
  return (s.transactions||[]).filter(t=>monthKeyOf(t.date)===monthKey)
    .reduce((a,t)=>a+Math.round(Number(t.amount)||0),0);
}

/* A "defaulter" here means: hasn't made a single payment this
   calendar month — not how much they owe. Zero-fee students (a
   free seat, or a fee type with no amount set) and students who

    if(balanceFor(s)<=0)return false;
    return paidInMonth(s,month)<=0;

function sessionProgressPercent(){
  const startKey=state.sessionStart,endKey=state.sessionEnd;
  if(!startKey||!endKey)return null;
  const [sy,sm]=startKey.split("-").map(Number);
  const [ey,em]=endKey.split("-").map(Number);
  if(!sy||!sm||!ey||!em)return null;
  const start=new Date(sy,sm-1,1);
  const end=new Date(ey,em,0,23,59,59);
  const total=end-start;
  if(total<=0)return null;
  const now=new Date();
  const elapsed=Math.max(0,Math.min(total,now-start));
  return Math.round((elapsed/total)*100);
}

/* ============================================================
   UNIVERSAL SEARCH — one box, searches students, payments and
   tests together. Results come back already grouped so the caller

function universalSearch(qRaw){
  const q=String(qRaw||"").trim().toLowerCase();
  if(!q)return {q:"",students:[],payments:[],tests:[]};
  const students=state.students.filter(s=>
    `${s.name||""} ${s.father||""} ${s.mother||""} ${s.admissionNo||""} ${membershipLabel(s)}`.toLowerCase().includes(q)
  ).slice(0,6);
  const payments=[];
  state.students.forEach(s=>(s.transactions||[]).forEach(t=>{
    const hay=`${s.name||""} ${t.mode||""} ${t.remark||""} ${t.amount||""}`.toLowerCase();
    if(hay.includes(q))payments.push({s,t});
  }));
  payments.sort((a,b)=>new Date(b.t.date)-new Date(a.t.date));
  const tests=state.tests.filter(t=>`${t.name||""} ${t.subject||""} ${t.class||""}`.toLowerCase().includes(q)).slice(0,6);
  return {q,students,payments:payments.slice(0,6),tests};
}
function universalSearchResultsHTML(qRaw){
  const r=universalSearch(qRaw);
  if(!r.q)return "";
  const total=r.students.length+r.payments.length+r.tests.length;
  if(!total)return `<div class="empty-note">No matches for "${esc(r.q)}".</div>`;
  const section=(title,rowsHtml)=>rowsHtml?`<div class="search-section"><div class="search-section-title">${esc(title)}</div>${rowsHtml}</div>`:"";
  const studentRows=r.students.map(s=>`
    <div class="activity-row" role="button" tabindex="0" onclick="showProfilePage('${esc(s.id)}')">
      ${classColorDotHTML(s)}
      <div class="activity-icon">${avatarHTML(s.name,36)}</div>
      <div class="activity-main"><div class="activity-title">${esc(s.name)}</div><div class="activity-sub">${esc(membershipLabel(s))}</div></div>
    </div>`).join("");
  const paymentRows=r.payments.map(({s,t})=>`
    <div class="activity-row" role="button" tabindex="0" onclick="showPaymentFormPage('${esc(s.id)}','${esc(t.id)}')">
      <div class="activity-icon">${activityIcon("payment")}</div>
      <div class="activity-main"><div class="activity-title">${esc(s.name)}</div><div class="activity-sub">${esc(t.mode||"Payment")} · ${fmtDate(t.date)}</div></div>
      <div class="activity-amount">+${money(t.amount)}</div>
    </div>`).join("");
  const testRows=r.tests.map(t=>`
    <div class="activity-row" role="button" tabindex="0" onclick="showTestDetailPage('${esc(t.id)}')">
      <div class="activity-icon">${activityIcon("test")}</div>
      <div class="activity-main"><div class="activity-title">${esc(t.name)}</div><div class="activity-sub">${esc(t.class||"")}${t.subject?" · "+esc(t.subject):""}</div></div>
    </div>`).join("");
  return `<div class="activity-panel universal-search-results">
    ${section(`Students (${r.students.length})`,studentRows)}
    ${section(`Payments (${r.payments.length})`,paymentRows)}
    ${section(`Tests (${r.tests.length})`,testRows)}
  </div>`;
}
function onUniversalSearchInput(){
  const val=document.getElementById("universalSearchInput")?.value||"";
  const out=document.getElementById("universalSearchResults");
  if(out)out.innerHTML=universalSearchResultsHTML(val);
}

  if(!wrap)return;
  wrap.classList.toggle("tile-mode",state.listView==="tile");
  const q=String(document.getElementById("studentSearch")?.value||"").trim().toLowerCase();
  let list=state.students.filter(s=>studentInClass(s,state.activeClass));
  if(q)list=list.filter(s=>`${s.name} ${s.father||""} ${s.mother||""} ${s.admissionNo||""}`.toLowerCase().includes(q));
  list=list.slice().sort((a,b)=>{
    const activeA=isActive(a),activeB=isActive(b);
    if(activeA!==activeB)return activeA?-1:1;
    return String(a.name||"").localeCompare(String(b.name||""),"en-IN",{sensitivity:"base",numeric:true});
  });
  const leftCount=state.students.filter(s=>!isActive(s)).length;
  if(!list.length){
    wrap.innerHTML=`<div class="empty-note">${q?"No matching students.":state.activeClass==="All"?"No students yet. Tap + Add above.":`No students in ${esc(state.activeClass)} yet.`}</div>

function collectMemberships(){
  const rows=[...document.querySelectorAll("#membershipFields [data-mrow]")];
  const out=[],seen=new Set();
  rows.forEach(row=>{
    const cls=row.querySelector("[data-mclass]")?.value||"";
    const subject=String(row.querySelector("[data-msubject]")?.value||"").trim();
    if(!cls)return;
    const key=cls+"|"+subject.toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    out.push({class:cls,subject,status:"active",addedDate:todayISO()});
  });
  return out;
}
function setFeeTypeChoice(type){

async function saveStudent(e,studentId){
  e.preventDefault();
  const f=new FormData(e.target);
  const name=String(f.get("name")||"").trim();
  if(!name)return alert("Enter the student's name.");
  const memberships=collectMemberships();
  if(!memberships.length)return alert("Add at least one class for this student.");
  const contacts=[...document.querySelectorAll("#contactFields [data-contact]")].map(x=>x.value.trim()).filter(Boolean);
  const feeType=f.get("feeType")==="monthly"?"monthly":"total";
  const data={
    name,
    admissionNo:String(f.get("admissionNo")||"").trim(),
    father:String(f.get("father")||"").trim(),
    mother:String(f.get("mother")||"").trim(),
    contacts:contacts.length?contacts:[""],
    remarks:String(f.get("remarks")||"").trim(),
    feeType,
    totalFees:feeType==="monthly"?0:safeFees(f.get("totalFees")),
    monthlyFee:feeType==="monthly"?safeFees(f.get("monthlyFee")):0,
    addedDate:f.get("addedDate")||todayISO()
  };
  const existing=studentId?state.students.find(x=>x.id===studentId):null;
  const leftDate=existing?.leftDate||"";
  data.memberships=memberships.map(m=>({...m,status:leftDate?"inactive":"active"}));
  data.leftDate=leftDate;
  if(existing){Object.assign(existing,data);}
  else{state.students.push({id:id(),...data,transactions:[]});}
  if(!await save())return;
  haptic();
  notify(existing?"Student updated.":"Student added.");
  if(existing)replacePage(profilePageHTML,existing.id);else showTab("students");
}
async function toggleStudentLeft(studentId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  if(s.leftDate){
    if(!confirm(`Restore ${s.name} as an active student?`))return;
    s.leftDate="";
    s.memberships.forEach(m=>m.status="active");
  }else{
    if(!confirm(`Mark ${s.name} as left, effective today? Their payment history is kept.`))return;
    s.leftDate=todayISO();
    s.memberships.forEach(m=>m.status="inactive");
  }
  if(!await save())return;
  haptic();replacePage(studentFormPageHTML,studentId);
}

async function shareText(text,qrDataUrl){
  haptic();

  if(navigator.share){try{await navigator.share({text});return;}catch(e){if(e&&e.name==="AbortError")return;}}

function toWhatsAppNumber(raw){
  const digits=String(raw||"").replace(/[^0-9]/g,"");
  if(!digits)return "";
  if(digits.length===10)return "91"+digits;
  if(digits.length===11&&digits.startsWith("0"))return "91"+digits.slice(1);
  return digits;
}
function practicalReminderAmount(amount){
  const n=Math.max(0,Math.round(Number(amount)||0));
  if(n<=0)return 0;
  const r100=Math.round(n/100)*100,r50=Math.round(n/50)*50;
  return (Math.abs(r50-n)<Math.abs(r100-n)&&r50%100===50)?r50:r100;
}

function txDateKey(t){return String(t?.date||"").slice(0,10)||"unknown";}
function txDateLabel(key){
  if(key==="unknown")return "Undated";
  const d=new Date(key+"T00:00:00"),now=new Date();
  if(isNaN(d))return key;
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((today-day)/86400000);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});
}

function sessionMonthsElapsed(){
  const startKey=state.sessionStart;
  if(!startKey)return 1;
  const [sy,sm]=startKey.split("-").map(Number);
  if(!sy||!sm)return 1;
  const start=new Date(sy,sm-1,1);
  let cap=new Date();
  const endKey=state.sessionEnd;
  if(endKey){
    const [ey,em]=endKey.split("-").map(Number);
    if(ey&&em){const sessionEndDate=new Date(ey,em,0);if(sessionEndDate<cap)cap=sessionEndDate;}
  }
  const months=(cap.getFullYear()-start.getFullYear())*12+(cap.getMonth()-start.getMonth())+1;
  return Math.max(1,months);
}
function paymentsTabHTML(){
  const rows=transactionOwnerRows().sort((a,b)=>new Date(b.t.date)-new Date(a.t.date));

function openExportExcelSheet(){
  const rows=transactionOwnerRows();
  const firstDate=rows.length?rows.map(r=>txDateKey(r.t)).sort()[0]:todayISO();
  const lastDate=rows.length?rows.map(r=>txDateKey(r.t)).sort().slice(-1)[0]:todayISO();
  openSheet("Export Payments to Excel",`
    <div class="field"><label>From</label><input id="txFrom" type="date" value="${firstDate}"></div>
    <div class="field"><label>To</label><input id="txTo" type="date" value="${lastDate}"></div>
    <div class="form-actions"><button type="button" class="btn btn-primary btn-block" onclick="exportTransactionRangeExcel()">Export Excel</button></div>
  `);
}
function renderPaymentsList(){
  const wrap=document.getElementById("paymentsListWrap");
  if(!wrap)return;
  wrap.classList.toggle("tile-mode",state.listView==="tile");
  const q=String(document.getElementById("paymentsSearch")?.value||"").trim().toLowerCase();
  let rows=transactionOwnerRows().sort((a,b)=>new Date(b.t.date)-new Date(a.t.date));
  if(q)rows=rows.filter(r=>`${txRowLabel(r)} ${txRowClassLabel(r)} ${r.t.remark||""} ${r.t.amount} ${fmtDate(txDateKey(r.t))}`.toLowerCase().includes(q));
  wrap.innerHTML=rows.length?`<div class="timeline-list">${groupedTxHTML(rows)}</div>`:`<div class="empty-note">${q?"No matching transactions.":"No transactions recorded yet."}</div>`;
}
function exportTransactionRangeExcel(){
  const from=document.getElementById("txFrom")?.value||"";
  const to=document.getElementById("txTo")?.value||"";
  if(!from||!to)return alert("Choose both dates.");
  if(from>to)return alert("The start date cannot be after the end date.");
  const rows=transactionOwnerRows().filter(r=>{const d=txDateKey(r.t);return d>=from&&d<=to;}).sort((a,b)=>new Date(a.t.date)-new Date(b.t.date));
  if(!rows.length)return alert("No transactions found in this date range.");
  if(!window.XLSX)return alert("Excel export tools could not load. Check your internet connection and try again.");
  const total=rows.reduce((a,r)=>a+Math.round(Number(r.t.amount)||0),0);
  const data=rows.map(r=>({
    Date:fmtDate(txDateKey(r.t)),
    Class:txRowClassLabel(r),
    Student:txRowLabel(r)+(r.kind==="left"?" (left)":""),
    Amount:Math.round(Number(r.t.amount)||0),
    Mode:r.t.mode||"",
    Remarks:r.t.remark||""
  }));
  data.push({Date:"",Class:"",Student:"TOTAL",Amount:total,Mode:"",Remarks:""});
  const ws=XLSX.utils.json_to_sheet(data);
  ws["!cols"]=[{wch:14},{wch:16},{wch:22},{wch:12},{wch:10},{wch:28}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Payments");
  XLSX.writeFile(wb,`transactions-${from}-to-${to}.xlsx`);
  closeSheet();
}

async function saveTransaction(e,studentId,txId){
  e.preventDefault();
  const s=state.students.find(x=>x.id===studentId);
  if(!s)return alert("This student no longer exists.");
  const f=new FormData(e.target);
  const amount=Number(f.get("amount"));
  if(!Number.isFinite(amount)||amount<=0)return alert("Enter a valid amount greater than 0.");
  const date=f.get("date");
  if(!date)return alert("Choose a payment date.");
  const mode=String(f.get("mode")||state.paymentModes[0]||"").trim();
  const data={date,amount,mode,remark:String(f.get("remark")||"").trim()};
  s.transactions=s.transactions||[];
  let saved;
  if(txId){
    saved=s.transactions.find(x=>x.id===txId);
    if(!saved)return alert("This transaction no longer exists.");
    Object.assign(saved,data);
  }else{
    saved={id:id(),...data};s.transactions.push(saved);
  }
  if(!await save())return;
  haptic();
  if(txId){notify("Payment updated.");replacePage(txDetailPageHTML,"student",studentId,saved.id);}
  else{notify("Payment saved.");replacePage(receiptPageHTML,studentId,saved.id);}
}

/* ---------- Receipt / transaction-history IMAGE (replaces PDF) ----------
   One canvas renderer, styled after the tutor's own receipt template,
   used both for a single payment's receipt and for a student's full
   transaction history — "rows" is just shorter in the first case. */
function receiptCanvasRows(s,onlyTx){
  const all=[...(s.transactions||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const rows=onlyTx?all.filter(t=>t.id===onlyTx.id||new Date(t.date)<=new Date(onlyTx.date)):all;
  return rows;
}
function renderReceiptCanvas(s,rows){
  const width=640,padX=44;
  const rowH=30,tableTop0=250;
  const paid=paidFor(s),balance=balanceFor(s);
  const totalLabel=isMonthlyFeeStudent(s)?"Fees / Month":"Total Fees";
  const totalVal=isMonthlyFeeStudent(s)?s.monthlyFee:s.totalFees;
  const tableRowsH=Math.max(1,rows.length)*rowH;
  const socialLines=[
    state.teacherWhatsapp?`WA: ${state.teacherWhatsapp}`:"",
    state.teacherInstagram?`IG: ${state.teacherInstagram.replace(/^@?/,"@")}`:"",
    state.teacherYoutube?`YT: ${state.teacherYoutube.replace(/^@?/,"@")}`:""
  ].filter(Boolean);
  const footerExtra=(state.teacher?32:0)+(socialLines.length?socialLines.length*26+10:0);
  const totalH=tableTop0+40+tableRowsH+40+120+140+footerExtra;
  const canvas=document.createElement("canvas");
  const scale=2;
  canvas.width=width*scale;canvas.height=totalH*scale;
  const ctx=canvas.getContext("2d");ctx.scale(scale,scale);
  ctx.fillStyle="#f3efe8";ctx.fillRect(0,0,width,totalH);
  ctx.fillStyle="#fbf9f4";ctx.fillRect(14,14,width-28,totalH-28);
  ctx.strokeStyle="#d8d2c4";ctx.lineWidth=1;ctx.strokeRect(14,14,width-28,totalH-28);
  ctx.textAlign="center";
  ctx.fillStyle="#1c1c1c";ctx.font="700 26px 'Courier New',monospace";
  ctx.fillText((state.brand||"Tuition Manager").toUpperCase(),width/2,66);
  ctx.strokeStyle="#1c1c1c";ctx.beginPath();ctx.moveTo(width/2-140,80);ctx.lineTo(width/2+140,80);ctx.stroke();
  ctx.font="700 15px 'Courier New',monospace";ctx.fillText("TRANSACTION HISTORY",width/2,112);
  ctx.textAlign="left";
  ctx.font="14px 'Courier New',monospace";ctx.fillStyle="#333";
  ctx.fillText("Student Name :",padX,146);
  ctx.font="700 14px 'Courier New',monospace";ctx.fillStyle="#111";
  ctx.fillText(s.name,padX+150,146);
  ctx.font="14px 'Courier New',monospace";ctx.fillStyle="#333";
  ctx.fillText("Class        :",padX,170);
  ctx.font="700 14px 'Courier New',monospace";ctx.fillStyle="#111";
  ctx.fillText(primaryClass(s)||membershipLabel(s),padX+150,170);
  ctx.strokeStyle="#b9b2a0";ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(padX,196);ctx.lineTo(width-padX,196);ctx.stroke();ctx.setLineDash([]);
  let y=224;
  ctx.font="700 12px 'Courier New',monospace";ctx.fillStyle="#111";
  ctx.fillText("S.NO.",padX,y);ctx.fillText("DATE",padX+70,y);ctx.fillText("AMOUNT (₹)",padX+230,y);ctx.fillText("MODE",padX+380,y);
  ctx.strokeStyle="#1c1c1c";ctx.beginPath();ctx.moveTo(padX,y+10);ctx.lineTo(width-padX,y+10);ctx.stroke();
  y+=36;
  ctx.font="14px 'Courier New',monospace";
  rows.forEach((t,i)=>{
    ctx.fillStyle="#222";
    ctx.fillText(String(i+1),padX,y);
    ctx.fillText(fmtDate(String(t.date).slice(0,10)),padX+70,y);
    ctx.fillText(Number(t.amount||0).toLocaleString("en-IN"),padX+230,y);
    ctx.fillText(t.mode||"—",padX+380,y);
    y+=rowH;
  });
  y+=10;
  ctx.strokeStyle="#b9b2a0";ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(width-padX,y);ctx.stroke();ctx.setLineDash([]);
  y+=32;
  const line=(label,val,bold)=>{
    ctx.font=(bold?"700 ":"")+"15px 'Courier New',monospace";ctx.fillStyle="#222";
    ctx.fillText(label,padX,y);
    ctx.font="700 15px 'Courier New',monospace";
    ctx.textAlign="right";ctx.fillText(val,width-padX,y);ctx.textAlign="left";
    y+=28;
  };
  line(totalLabel,money(totalVal).replace("₹","₹"),false);
  line("Total Fees Paid",money(paid),false);
  line("Balance",money(balance),true);
  y+=14;
  ctx.strokeStyle="#b9b2a0";ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(width-padX,y);ctx.stroke();ctx.setLineDash([]);
  y+=34;
  ctx.textAlign="center";ctx.font="14px 'Courier New',monospace";ctx.fillStyle="#333";
  ctx.fillText("Thank you for being a part of",width/2,y);y+=28;
  ctx.font="700 20px 'Courier New',monospace";ctx.fillStyle="#111";
  ctx.fillText((state.brand||"Tuition Manager").toUpperCase(),width/2,y);
  if(state.teacher){
    y+=32;
    ctx.font="14px 'Courier New',monospace";ctx.fillStyle="#333";
    ctx.fillText(state.teacher,width/2,y);
  }
  socialLines.forEach(line=>{
    y+=26;
    ctx.font="14px 'Courier New',monospace";ctx.fillStyle="#333";
    ctx.fillText(line,width/2,y);
  });
  return canvas;
}
async function shareReceiptImage(studentId,txId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;

    <div class="page-head"><button type="button" class="btn back-btn" onclick="goBack()">‹</button><div><div class="page-title">Edit Retained Transaction</div><div class="page-sub">${esc(b.originalName)}</div></div></div>

        <div class="field"><label>Remarks</label><textarea name="remark" rows="2">${esc(t.remark||"")}</textarea></div>
      </section>

    </form>

}
async function saveLeftTx(e,bucketId,txId){
  e.preventDefault();
  const b=state.leftStudentTransactions.find(x=>x.id===bucketId);
  const t=b&&(b.transactions||[]).find(x=>x.id===txId);
  if(!t)return alert("This transaction no longer exists.");
  const f=new FormData(e.target);
  const amount=Number(f.get("amount"));
  if(!Number.isFinite(amount)||amount<=0)return alert("Enter a valid amount greater than 0.");
  const date=f.get("date");if(!date)return alert("Choose a payment date.");
  Object.assign(t,{date,amount,remark:String(f.get("remark")||"").trim()});
  if(!await save())return;
  notify("Transaction updated.");
  replacePage(txDetailPageHTML,"left",bucketId,txId);
}
async function deleteLeftTx(bucketId,txId){
  if(!confirm("Delete this transaction? This cannot be undone."))return;
  const b=state.leftStudentTransactions.find(x=>x.id===bucketId);if(!b)return;
  b.transactions=(b.transactions||[]).filter(t=>t.id!==txId);
  state.leftStudentTransactions=state.leftStudentTransactions.filter(x=>(x.transactions||[]).length);
  if(!await save())return;
  notify("Transaction deleted.");
  goBack();
}

/* ---------- Fee reminder — real balance only ----------
   "This month's due" is dead simple now: how much was actually paid
   with a transaction dated in the current month, compared with a flat
   share of the total spread across the student's whole session (join
   month → left/session-end month). No front-loading, no back-loading,
   no invented schedule — short by even ₹1 and they're on the list;
   money paid in advance settles the month it was paid in, not the
   months still to come. */
function totalMonthsForStudent(s){
  const addedMonth=String(s.addedDate||todayISO()).slice(0,7);
  const startIdx=monthIndex(addedMonth);
  if(!Number.isFinite(startIdx))return 1;
  const endMonth=s.leftDate?String(s.leftDate).slice(0,7):(state.sessionEnd||currentMonthKey());
  let endIdx=monthIndex(endMonth);
  if(!Number.isFinite(endIdx)||endIdx<startIdx)endIdx=startIdx;
  return endIdx-startIdx+1;
}
function whatsappRemindStudent(studentId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  const paid=paidFor(s),balance=balanceFor(s);
  const monthly=isMonthlyFeeStudent(s);
  const suggested=thisMonthDueForStudent(s)||practicalReminderAmount(balance);
  openSheet("Remind Fees",`
    <section class="profile-stats" style="margin-bottom:14px">${feeStatsHTML(s)}</section>
    <div class="field"><label>Amount to Request</label><input id="reminderAmount" type="number" min="0" step="50" value="${suggested}" onkeydown="if(event.key==='Enter'){event.preventDefault();sendReminder('${esc(s.id)}')}"></div>
    <div class="field-help" style="margin:-4px 0 14px">${monthly?`Suggested from the balance owed so far this month.`:`Suggested from ${money(s.totalFees)} spread flat over ${totalMonthsForStudent(s)} month${totalMonthsForStudent(s)===1?"":"s"} of enrollment.`} Edit freely — enter whatever amount you're actually expecting.</div>
    <button type="button" class="btn btn-primary btn-block" onclick="sendReminder('${esc(s.id)}')">Request</button>
  `);
  setTimeout(()=>document.getElementById("reminderAmount")?.focus(),40);
}
async function sendReminder(studentId){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  const amount=Number(document.getElementById("reminderAmount")?.value);
  if(!Number.isFinite(amount)||amount<0)return notify("Enter a valid amount.","error");
  closeSheet();
  if(state.qrCodeDataUrl||state.upiId){askQrChoiceThenSend(studentId,amount);return;}
  await deliverFeeMessage(s,amount,null);
}
/* Fee reminders can optionally carry the teacher's payment QR code +
   UPI ID — ask which one to use (or skip) before sending. */
function askQrChoiceThenSend(studentId,amount){
  const hasDefault=!!state.qrCodeDataUrl;
  openSheet("Include Payment QR?",`
    <div class="choice-list">
      ${hasDefault?`<button type="button" class="btn choice-item" onclick="closeSheet();deliverFeeMessageFor('${esc(studentId)}',${amount},'default')">
        <b>Use Saved QR Code</b><span>Your default QR + UPI ID</span></button>`:""}
      <label class="btn choice-item" style="cursor:pointer">
        <b>Upload a QR Code</b><span>Just for this message</span>
        <input type="file" accept="image/*" style="display:none" onchange="uploadQrThenSend('${esc(studentId)}',${amount},this)">
      </label>
      <button type="button" class="btn choice-item" onclick="closeSheet();deliverFeeMessageFor('${esc(studentId)}',${amount},'none')">
        <b>Without QR Code</b><span>Send the text reminder only</span></button>
    </div>
  `);
}
async function uploadQrThenSend(studentId,amount,input){
  const file=input.files&&input.files[0];if(!file)return;
  closeSheet();
  try{
    const dataUrl=await fileToResizedDataURL(file,500);
    await deliverFeeMessageFor(studentId,amount,"upload",dataUrl);
  }catch(e){notify("Could not read that image.","error");}
}
async function deliverFeeMessageFor(studentId,amount,choice,uploadedDataUrl){
  const s=state.students.find(x=>x.id===studentId);if(!s)return;
  const qrDataUrl=choice==="default"?state.qrCodeDataUrl:choice==="upload"?uploadedDataUrl:null;
  await deliverFeeMessage(s,amount,choice==="none"?null:qrDataUrl);
}
/* Where the message actually goes: exactly one contact number → straight
   to WhatsApp for that number. Several numbers → ask which one first.
   No number on file at all → hand it to the device's own share sheet so
   the teacher picks the app and the recipient themselves. */
async function deliverFeeMessage(s,amount,qrDataUrl){
  const paid=paidFor(s);
  const feeLine=isMonthlyFeeStudent(s)?`Fees / Month: ${money(s.monthlyFee)}`:`Total Fees: ${money(s.totalFees)}`;
  let text=`Dear Parent,\n\nFee update for ${s.name} (${membershipLabel(s)}):\n${feeLine}\nPaid till date: ${money(paid)}\nAmount requested (${monthLabel(currentMonthKey())}): ${money(amount)}\n\nKindly pay at the earliest convenience.`;
  if(qrDataUrl&&state.upiId)text+=`\n\nPay via UPI: ${state.upiId}\n(QR code attached)`;
  else if(qrDataUrl)text+=`\n\n(QR code attached)`;
  text+=`\n— ${state.teacher||state.brand||"Tuition Manager"}`;
  const numbers=(s.contacts||[]).filter(Boolean);
  haptic();
  if(!numbers.length){await shareText(text,qrDataUrl);return;}
  if(numbers.length===1){await openWhatsAppTo(numbers[0],text,qrDataUrl);return;}
  openSheet("Send To Which Number?",`
    <div class="choice-list">${numbers.map((n,i)=>`
      <button type="button" class="btn choice-item" onclick="closeSheet();openWhatsAppTo('${esc(n).replace(/'/g,"&#039;")}',${JSON.stringify(text)},${JSON.stringify(qrDataUrl||"")})">
        <b>${iconGlyph("phone")}Contact ${i+1}</b><span>${esc(n)}</span>
      </button>`).join("")}
    </div>
  `);
}
function dataUrlToFile(dataUrl,filename){
  const [meta,b64]=dataUrl.split(",");
  const mime=(meta.match(/data:(.*);base64/)||[])[1]||"image/jpeg";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new File([bytes],filename,{type:mime});
}
async function tryShareWithQr(text,qrDataUrl){
  if(!qrDataUrl||!navigator.canShare||!navigator.share)return false;
  try{
    const file=dataUrlToFile(qrDataUrl,"payment-qr.jpg");
    if(!navigator.canShare({files:[file]}))return false;
    await navigator.share({files:[file],text});
    return true;
  }catch(e){return e&&e.name==="AbortError"?true:false;}
}
async function openWhatsAppTo(phone,text,qrDataUrl){
  if(qrDataUrl&&await tryShareWithQr(text,qrDataUrl))return;
  const wa=toWhatsAppNumber(phone);
  if(wa){
    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`,"_blank","noopener");
    notify(qrDataUrl?"Reminder ready — attach the QR code manually before sending.":"Reminder ready to send.");
  }else shareText(text,qrDataUrl);
}

/* ============================================================
   CHUNK 4 — TESTS
   A test belongs to one class. Marks live on the test as
   {studentId: number}; a blank entry means absent, a recorded
   zero means present and scored zero — these are kept distinct
   everywhere, matching the rule from the old build.
   ============================================================ */
function testStats(t){
  const values=Object.values(t.marks||{}).map(Number).filter(Number.isFinite);
  if(!values.length)return null;
  const avg=values.reduce((a,b)=>a+b,0)/values.length;
  return {avg,count:values.length};
}
function testRosterFor(t){
  return state.students.filter(s=>
    (isActive(s)&&studentHasClass(s,t.class))||(t.marks&&t.marks[s.id]!==undefined)||(t.absent&&t.absent[s.id])
  ).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"en-IN",{sensitivity:"base",numeric:true}));
}
function testsForStudent(s){
  const classes=new Set(activeMemberships(s).map(m=>m.class));
  return state.tests.filter(t=>classes.has(t.class)||(t.marks&&t.marks[s.id]!==undefined)||(t.absent&&t.absent[s.id]))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
}

async function saveTest(e,testId){
  e.preventDefault();
  const f=new FormData(e.target);
  const name=String(f.get("name")||"").trim();
  if(!name)return alert("Enter a test name.");
  const cls=f.get("class");
  const date=f.get("date");
  if(!date)return alert("Choose a test date.");
  const maxMarks=Number(f.get("maxMarks"));
  if(!Number.isFinite(maxMarks)||maxMarks<=0)return alert("Enter a valid maximum marks value.");
  const marks={},absent={};
  for(const inp of document.querySelectorAll("#testRosterWrap [data-student-id]")){
    const sid=inp.dataset.studentId,v=inp.value.trim();
    if(v===""){absent[sid]=true;continue;}
    const n=Number(v);
    if(!Number.isFinite(n)||n<0||n>maxMarks)return alert(`Marks must be between 0 and ${maxMarks}.`);
    marks[sid]=n;
  }
  const data={name,subject:String(f.get("subject")||"").trim(),class:cls,date,maxMarks,marks,absent};
  if(testId){
    const existing=state.tests.find(x=>x.id===testId);
    if(!existing)return alert("This test no longer exists.");
    Object.assign(existing,data);
  }else{
    state.tests.push({id:id(),...data});
  }
  if(!await save())return;
  haptic();
  notify(testId?"Test updated.":"Test saved.");
  showTab("tests");
}
async function deleteTest(testId){
  const t=state.tests.find(x=>x.id===testId);if(!t)return;
  if(!confirm(`Delete "${t.name}" and all of its recorded marks? This cannot be undone.`))return;
  state.tests=state.tests.filter(x=>x.id!==testId);
  if(!await save())return;
  notify("Test deleted.");
  showTab("tests");
}

/* ============================================================
   CHUNK 5 — ATTENDANCE
   Sharded storage: one small record per class+month
   (attendance:<class>:<yyyy-mm>), so years of daily marking
   never bloat the main state blob. An in-memory cache warms a
   slot before any page reads it, and every render pulls the
   class+month baked into ITS OWN page args — there is no
   single shared "current" pointer that can drift out of sync
   with what's on screen, which was the root of the old app's
   worst bug (saving attendance under the wrong date/class after
   switching twice and hitting Back).
   ============================================================ */
function attKey(cls,ym){return ATT_PREFIX+encodeURIComponent(cls)+":"+ym;}
async function loadAttendanceMonth(cls,ym){
  try{
    const raw=await storage.get(attKey(cls,ym));
    if(!raw)return {holidays:[],records:{}};
    const parsed=JSON.parse(raw);
    const records=(parsed.records&&typeof parsed.records==="object")?parsed.records:{};
    Object.values(records).forEach(day=>{
      if(!day||typeof day!=="object")return;
      Object.keys(day).forEach(sid=>{if(day[sid]==="leave")day[sid]="absent";});
    });
    return {holidays:Array.isArray(parsed.holidays)?parsed.holidays:[],records};
  }catch(e){return {holidays:[],records:{}};}
}
async function saveAttendanceMonth(cls,ym,data){
  try{await storage.set(attKey(cls,ym),JSON.stringify(data));return true;}
  catch(e){notify("Could not save attendance — storage error.","error");return false;}
}
let attCache={};
async function warmAttMonth(cls,ym){
  const key=cls+":"+ym;
  if(!attCache[key])attCache[key]=await loadAttendanceMonth(cls,ym);
  return attCache[key];
}

function redoAttendanceDay(cls,dateISO){

async function saveAttendanceForDate(cls,dateISO){
  const ym=monthKeyOf(dateISO),month=attCache[cls+":"+ym];if(!month)return;
  if(!month.records[dateISO])month.records[dateISO]={};
  const dayRecord=month.records[dateISO];
  /* Only absentees need an explicit tap — everyone else in the roster
     is assumed present, so fill them in automatically before saving. */
  activeStudentsForClass(cls).forEach(s=>{
    if(dayRecord[s.id]!=="absent")dayRecord[s.id]="present";

  if(!ok)return;
  haptic();notify("Attendance saved for "+fmtDate(dateISO)+".");
}

/* ---------- Per-student attendance (from profile) ---------- */
async function attendanceSummaryForStudent(s){
  const start=String(state.sessionStart||s.addedDate||todayISO()).slice(0,7);
  const current=currentMonthKey();
  const endKey=(state.sessionEnd&&String(state.sessionEnd).slice(0,7)<current)?String(state.sessionEnd).slice(0,7):current;
  const from=monthIndex(start),to=monthIndex(endKey);
  const classes=[...new Set((s.memberships||[]).map(m=>m.class).filter(Boolean))];
  let present=0,absent=0,off=0;
  const daily=[];
  if(Number.isFinite(from)&&Number.isFinite(to)){
    for(const cls of classes){
      for(let idx=from;idx<=to;idx++){
        const y=Math.floor(idx/12),m=idx%12+1,ym=`${y}-${String(m).padStart(2,"0")}`;
        const month=await loadAttendanceMonth(cls,ym);
        Object.entries(month.records||{}).forEach(([date,rec])=>{
          if(!String(date).startsWith(ym)||month.holidays.includes(date))return;
          const status=rec?.[s.id]||"";
          if(status==="present"){present++;daily.push({date,status:"present",cls});}
          else if(status==="absent"){absent++;daily.push({date,status:"absent",cls});}
        });
        month.holidays.filter(d=>String(d).startsWith(ym)).forEach(date=>{off++;daily.push({date,status:"off",cls});});
      }
    }
  }
  daily.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const working=present+absent;
  return {present,absent,off,working,pct:working?Math.round(present/working*100):0,daily};
}

async function addCustomClass(e){
  e.preventDefault();
  const name=String(new FormData(e.target).get("className")||"").trim();
  if(!name)return;
  if(state.classes.some(c=>c.toLowerCase()===name.toLowerCase()))return alert("That class already exists.");
  if(state.retiredClasses.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert("That name belongs to a retired class. Restore it instead of creating a new one, or pick a different name.");
  state.classes.push(name);state.activeClass=name;
  if(!await save())return;
  haptic();replacePage(classesPageHTML);
}
function openRenameClassSheet(oldName){
  const oldJs=esc(oldName).replace(/'/g,"&#039;");
  openSheet("Rename Class",`
    <div class="field"><label>New name</label><input id="renameClassInput" value="${esc(oldName)}" maxlength="80" onkeydown="if(event.key==='Enter'){event.preventDefault();submitRenameClass('${oldJs}')}"></div>
    <button type="button" class="btn btn-primary btn-block" onclick="submitRenameClass('${oldJs}')">Save</button>
  `);
  setTimeout(()=>document.getElementById("renameClassInput")?.focus(),40);
}
async function submitRenameClass(oldName){
  const name=String(document.getElementById("renameClassInput")?.value||"").trim();
  if(!name||name===oldName){closeSheet();return;}
  if(state.classes.some(c=>c.toLowerCase()===name.toLowerCase()))return alert("That class already exists.");
  state.classes=state.classes.map(c=>c===oldName?name:c);
  state.students.forEach(s=>(s.memberships||[]).forEach(m=>{if(m.class===oldName)m.class=name;}));
  state.tests.forEach(t=>{if(t.class===oldName)t.class=name;});
  if(state.classGroupLinks[oldName]!==undefined){state.classGroupLinks[name]=state.classGroupLinks[oldName];delete state.classGroupLinks[oldName];}
  if(state.classColors&&state.classColors[oldName]!==undefined){state.classColors[name]=state.classColors[oldName];delete state.classColors[oldName];}
  if(state.activeClass===oldName)state.activeClass=name;
  await migrateAttendanceClassName(oldName,name);
  if(!await save())return;
  closeSheet();haptic();notify("Class renamed.");
  replacePage(classesPageHTML);
}
async function migrateAttendanceClassName(oldName,newName){
  try{
    const prefix=ATT_PREFIX+encodeURIComponent(oldName)+":";
    const keys=await storage.keys(prefix);
    for(const key of keys){
      const raw=await storage.get(key);
      if(raw===null)continue;
      const ym=key.slice(prefix.length);
      await storage.set(attKey(newName,ym),raw);
      await storage.delete(key);
    }
    attCache={};
  }catch(e){/* best-effort — attendance history stays under the old name if this fails */}
}
async function retireClass(name){
  const affected=state.students.filter(s=>isActive(s)&&studentHasClass(s,name)).length;
  const hasTests=state.tests.some(t=>t.class===name);
  if(affected||hasTests)return alert(`This class is still in use by ${affected} active student${affected===1?"":"s"}${hasTests?" or recorded tests":""}. Move those first so history isn't lost.`);
  if(!confirm(`Retire "${name}"? It comes off every class picker, but all its history — including attendance — stays reachable from Retired Classes.`))return;
  state.classes=state.classes.filter(c=>c!==name);
  state.retiredClasses.push({name,retiredDate:todayISO()});
  if(state.activeClass===name)state.activeClass="All";
  if(!await save())return;
  haptic();notify("Class retired.");
  replacePage(classesPageHTML);
}
async function restoreClass(name){
  if(state.classes.some(c=>c.toLowerCase()===name.toLowerCase()))return alert("A class with this name already exists.");
  state.retiredClasses=state.retiredClasses.filter(rc=>rc.name!==name);
  state.classes.push(name);
  if(!await save())return;
  haptic();notify("Class restored.");
  replacePage(classesPageHTML);
}
function viewRetiredClassHistory(name){
  showAttendanceSummaryPage(name,currentMonthKey());
}

function reportsPerformanceHTML(){

/* Reads an <input type=file> image, downsizes it to a sane max
   dimension via canvas, and hands back a data: URL — keeps the
   photo/QR small enough to store comfortably in IndexedDB/localStorage. */
function fileToResizedDataURL(file,maxDim){
  return new Promise((resolve,reject)=>{
    if(!file)return reject(new Error("no file"));
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error);
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("bad image"));
      img.onload=()=>{
        let {width:w,height:h}=img;
        if(w>maxDim||h>maxDim){
          const scale=maxDim/Math.max(w,h);
          w=Math.round(w*scale);h=Math.round(h*scale);
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.86));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function makeResetCode(){
  const words=["amber","atlas","cedar","comet","delta","ember","falcon","forest","harbor","indigo","lunar","maple","orbit","pearl","quartz","river","silver","solar","stone","tiger","violet","willow"];
  const pick=()=>words[Math.floor(Math.random()*words.length)];
  let code=`${pick()} ${pick()} ${pick()}`;
  while(new Set(code.split(" ")).size<3)code=`${pick()} ${pick()} ${pick()}`;
  return code;
}

async function buildBackupPayload(){
  const attendance={};
  const attKeys=await storage.keys(ATT_PREFIX);
  for(const key of attKeys){const raw=await storage.get(key);if(raw!==null)attendance[key]=JSON.parse(raw);}
  return {format:"tuition-manager-backup",version:1,exportedAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(state)),attendance};
}
async function applyRestoredBackup(raw){
  if(!raw||raw.format!=="tuition-manager-backup"||!raw.state)throw new Error("bad format");
  const existingAttKeys=await storage.keys(ATT_PREFIX);
  for(const key of existingAttKeys)await storage.delete(key);
  const attendance=raw.attendance&&typeof raw.attendance==="object"?raw.attendance:{};
  for(const [key,value] of Object.entries(attendance)){
    if(!key.startsWith(ATT_PREFIX))continue;
    await storage.set(key,JSON.stringify(value));
  }
  attCache={};
  state=raw.state;
  normalizeState();
  state.loggedOut=false;
  if(!await save())throw new Error("save failed");
}

async function exportDataBackup(){
  try{
    const backup=await buildBackupPayload();
    const now=new Date(),pad=n=>String(n).padStart(2,"0");
    const date=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
    const institute=String(state.brand||"Tuition-Manager").trim().replace(/[^a-zA-Z0-9 _-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-")||"Tuition-Manager";
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`${institute}-backup-${date}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    state.lastBackupAt=new Date().toISOString();
    await save();
    haptic();notify("Backup downloaded.");
    const top=pageStack[pageStack.length-1];
    if(top&&top.fn===backupPageHTML)replacePage(backupPageHTML);
  }catch(e){notify("Backup could not be created.","error");}
}
function importDataBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const raw=JSON.parse(reader.result);
      if(raw?.format!=="tuition-manager-backup")throw new Error("bad format");
      if(!confirmDestructiveRestore()){e.target.value="";return;}
      await applyRestoredBackup(raw);
      notify("Backup restored.");
      setTimeout(()=>{init();},300);
    }catch(err){
      notify("Invalid backup file. Select a Tuition Manager JSON backup.","error");
    }finally{e.target.value="";}
  };
  reader.readAsText(file);
}

/* ---------- Google Drive backup & sync ----------
   Requires a real https:// origin (registered as an Authorized
   JavaScript origin in Google Cloud Console) — this will not
   work opened as a local file. Uses drive.file scope, so the
   app can only see the one backup file it creates, nothing
   else in your Drive. */
const GOOGLE_CLIENT_ID="PASTE_YOUR_CLIENT_ID_HERE.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file";
const DRIVE_BACKUP_FILENAME="tuition-manager-backup.json";
let gDriveTokenClient=null,gDriveAccessToken=null,gDriveEmail=null;
function ensureGoogleClientReady(){
  return new Promise((resolve,reject)=>{
    if(window.google?.accounts?.oauth2)return resolve();
    let tries=0;
    const iv=setInterval(()=>{
      if(window.google?.accounts?.oauth2){clearInterval(iv);resolve();}
      else if(++tries>50){clearInterval(iv);reject(new Error("Google library failed to load"));}
    },100);
  });
}
async function connectGoogleDrive(){
  if(GOOGLE_CLIENT_ID.includes("PASTE_YOUR"))return notify("Google Drive isn't configured yet.","error");
  try{await ensureGoogleClientReady();}catch(e){return notify("Could not load Google's sign-in library. Check your connection.","error");}
  if(!gDriveTokenClient){
    gDriveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:DRIVE_SCOPE,
      callback:async(resp)=>{
        if(resp.error){notify("Google sign-in failed or was cancelled.","error");return;}
        gDriveAccessToken=resp.access_token;
        await fetchGoogleProfileEmail();
        haptic();notify("Connected to Google Drive.");
        refreshPage();
      }
    });
  }
  gDriveTokenClient.requestAccessToken({prompt:""});
}
async function fetchGoogleProfileEmail(){
  try{
    const res=await fetch("https://www.googleapis.com/oauth2/v2/userinfo",{headers:{Authorization:"Bearer "+gDriveAccessToken}});
    const data=await res.json();
    gDriveEmail=data.email||"";
  }catch(e){gDriveEmail="";}
}
function disconnectGoogleDrive(){
  if(gDriveAccessToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(gDriveAccessToken,()=>{});
  gDriveAccessToken=null;gDriveEmail=null;
  notify("Disconnected from Google Drive.");
  refreshPage();
}
async function findDriveBackupFile(){
  const q=encodeURIComponent(`name='${DRIVE_BACKUP_FILENAME}' and trashed=false`);
  const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,modifiedTime)`,{headers:{Authorization:"Bearer "+gDriveAccessToken}});
  if(res.status===401){gDriveAccessToken=null;throw new Error("Session expired — connect again.");}
  if(!res.ok)throw new Error("Drive request failed");
  const data=await res.json();
  return data.files&&data.files[0]?data.files[0]:null;
}
async function backupToGoogleDrive(){
  if(!gDriveAccessToken)return notify("Connect Google Drive first.","error");
  try{
    notify("Backing up to Google Drive…");
    const payload=await buildBackupPayload();
    const existing=await findDriveBackupFile();
    const boundary="tuition_mgr_"+id();
    const metadata={name:DRIVE_BACKUP_FILENAME,mimeType:"application/json"};
    const body=
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n`+
      `--${boundary}--`;
    const url=existing?`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`:`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res=await fetch(url,{
      method:existing?"PATCH":"POST",
      headers:{Authorization:"Bearer "+gDriveAccessToken,"Content-Type":`multipart/related; boundary=${boundary}`},
      body
    });
    if(!res.ok)throw new Error("Upload failed");
    state.lastDriveSync=new Date().toISOString();
    state.lastBackupAt=state.lastDriveSync;
    await save();
    haptic();notify("Backed up to Google Drive.");
    refreshPage();
  }catch(e){notify(e.message==="Session expired — connect again."?e.message:"Google Drive backup failed. Try again.","error");refreshPage();}
}
async function restoreFromGoogleDrive(){
  if(!gDriveAccessToken)return notify("Connect Google Drive first.","error");
  try{
    const existing=await findDriveBackupFile();
    if(!existing)return notify("No backup found in Google Drive yet.","error");
    if(!confirmDestructiveRestore())return;
    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${existing.id}?alt=media`,{headers:{Authorization:"Bearer "+gDriveAccessToken}});
    if(!res.ok)throw new Error("Download failed");
    const raw=await res.json();
    await applyRestoredBackup(raw);
    notify("Restored from Google Drive.");
    setTimeout(()=>{init();},300);
  }catch(e){notify(e.message==="Session expired — connect again."?e.message:"Could not restore from Google Drive.","error");refreshPage();}
}

}

/* ---------- Install as an app ----------
   Chrome/Edge fire beforeinstallprompt when the page qualifies as an
   installable PWA (valid manifest + service worker, served over
   HTTPS — exactly what GitHub Pages gives this app). We hold onto
   that event so "Install App" in More can trigger the native prompt
   on demand instead of only whenever the browser feels like offering
   its own address-bar icon. iOS Safari never fires this event — it
   only ever offers "Add to Home Screen" from its own Share sheet. */
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
});
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;});
function isRunningInstalled(){
  return window.matchMedia?.("(display-mode: standalone)")?.matches||window.navigator.standalone===true;
}
async function installAppNow(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice;}catch(e){}
    deferredInstallPrompt=null;
    return;
  }
  openSheet("Install App",`
    <p style="margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6">
      ${isRunningInstalled()
        ? "You're already using the installed app — nothing more to do."
        : /iphone|ipad|ipod/i.test(navigator.userAgent)
          ? "On iPhone/iPad: tap the Share icon in Safari's toolbar, then \"Add to Home Screen\". It'll open full-screen from your home screen like any other app, no browser bar."
          : "Your browser will show its own install icon — a small download/computer icon right in the address bar (desktop) or an \"Install app\" / \"Add to Home Screen\" option in the browser menu (mobile). Tap that to add it as an app or home-screen shortcut."}
    </p>
    <button type="button" class="btn btn-block" onclick="closeSheet()">Got it</button>
  `);
}
